<style>
:root{

}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;scroll-behavior:smooth}

.op-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:4px 0 24px}

.op-eyebrow:before{content:"";width:18px;height:2px;border-radius:9px;background:var(--opp-coral)}
#main h1{margin:0;color:var(--opp-ink);font-size:clamp(29px,3.3vw,38px);line-height:1.12;letter-spacing:-.045em;font-weight:750}

.op-flow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end;color:var(--opp-muted);font-size:11px;font-weight:650;white-space:nowrap;padding-bottom:3px}

#hero{margin:0 0 22px}
.card{background:var(--opp-card);color:var(--opp-ink);border:1px solid var(--opp-line);border-radius:17px;padding:18px;margin:0 0 14px;box-shadow:0 2px 8px rgba(24,32,28,.025);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
#view>.card:hover,#view .board .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--opp-primary) 30%,var(--opp-line));box-shadow:0 9px 24px rgba(24,32,28,.07)}

.opp-next-copy{min-width:0}.opp-next-title{display:block;margin-bottom:3px;color:var(--opp-primary);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:750}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--opp-coral) 65%,transparent);outline-offset:2px}
button.b,a.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid var(--opp-primary);border-radius:10px;background:var(--opp-primary);color:#fff;padding:8px 13px;font:650 12px/1.25 'Geist',system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:normal;text-align:center;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
button.b:hover:not(:disabled),a.b:hover{transform:translateY(-1px);box-shadow:0 4px 13px rgba(23,80,74,.17)}
button.b.alt,a.b.alt{background:var(--opp-card);color:var(--opp-primary)}
button.b.dng{background:var(--opp-card);color:var(--opp-bad);border-color:color-mix(in srgb,var(--opp-bad) 52%,var(--opp-line))}
button:disabled{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none!important}
input,textarea,select{display:block;max-width:100%;min-width:0;width:100%;border:1px solid var(--opp-line);border-radius:10px;padding:10px 11px;background:var(--opp-field);color:var(--opp-ink);font:14px/1.4 'Geist',system-ui,sans-serif;box-shadow:none;transition:border-color .16s ease,box-shadow .16s ease}

textarea{min-height:106px;resize:vertical}
label{display:block;margin:9px 0 4px;color:var(--opp-muted);font-size:12px;font-weight:650;line-height:1.4}
.row>input,.row>select{flex:1 1 210px;width:auto}
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.grid label{margin-top:0}
.pill{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 9px;border:1px solid transparent;border-radius:99px;background:var(--opp-well);color:var(--opp-primary);font-size:11px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.pill.Strong,.pill.good{background:#dff3e8;color:var(--opp-good)}.pill.Good{background:#e8f3df;color:#3c6b17}.pill.Partial,.pill.warn{background:#fdecd9;color:var(--opp-warn)}.pill.Poor,.pill.bad,.pill.crit{background:#fbe0dd;color:var(--opp-bad)}
.sig{margin:14px 0}.sig b,.k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--opp-muted)}.sig ul,.k ul{margin:6px 0 0;padding-left:18px}.sig li{margin:4px 0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;align-items:start;padding:2px 2px 14px;scroll-snap-type:x proximity}
.col{min-height:150px;background:var(--opp-well);border:1px solid var(--opp-line);border-radius:14px;padding:11px;scroll-snap-align:start}
.col h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--opp-muted);margin:2px 4px 10px}
.col .card{padding:13px;margin-bottom:9px;cursor:pointer;box-shadow:none}.col .card:last-child{margin-bottom:0}
.note{background:#fff7e6;border:1px solid #f1d9a6;border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.55;margin:10px 0;color:#654b13}
pre.mail{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 'Geist',system-ui,sans-serif;background:var(--opp-well);border:1px solid var(--opp-line);border-radius:11px;padding:12px}
.meter{height:6px;border-radius:99px;background:var(--opp-well);overflow:hidden;margin:11px 0 3px}.meter i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--opp-coral),var(--opp-primary))}
.skel{height:82px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--opp-well) 85%,var(--opp-card)),var(--opp-card),color-mix(in srgb,var(--opp-well) 85%,var(--opp-card)));background-size:800px 100%;animation:oppShimmer 1.25s linear infinite}
@keyframes oppShimmer{to{background-position:800px 0}}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,4vh,34px) 12px;background:rgba(7,13,11,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal.on{display:flex}
.modal>div{width:min(100%,680px);max-height:none;min-height:0;padding:22px;background:var(--opp-card);color:var(--opp-ink);border:1px solid var(--opp-line);border-radius:19px;box-shadow:0 24px 70px rgba(0,0,0,.2)}
.modal h2{margin-bottom:12px!important}.modal .row{gap:8px}.modal p{margin:10px 0;color:var(--opp-ink)}.modal .grid{gap:12px}
.toast{position:fixed;z-index:120;left:50%;bottom:clamp(76px,8vh,100px);transform:translateX(-50%);max-width:calc(100vw - 28px);width:max-content;background:var(--opp-ink);color:var(--opp-bg);padding:11px 16px;border:1px solid var(--opp-line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.17);font-size:13px;line-height:1.4;display:none;text-align:center}
#view[aria-busy=true]{min-height:180px}
#view>h2{margin:25px 0 12px}#view>h2:first-child{margin-top:0}
#view .card p{line-height:1.7}
#view a:not(.b){color:var(--opp-primary);text-underline-offset:3px;overflow-wrap:anywhere}
#view .row{margin-top:7px}
#view .row:first-child{margin-top:0}
#view .card>.mut:first-child{margin-top:2px}
@media(max-width:900px){#main{padding:24px 18px 124px}.op-head{align-items:flex-start;flex-direction:column;gap:14px}.op-flow{justify-content:flex-start}.opp-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){#main{padding:20px 13px 115px}.op-head{margin-bottom:17px}#main h1{font-size:30px}.op-flow{gap:5px}.op-flow span{padding:5px 7px;font-size:10px}.opp-hero{padding:14px}.opp-hero-top{align-items:flex-start;flex-direction:column}.opp-hero-top .b{width:100%}.opp-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opp-stat{padding:12px}.opp-stat strong{font-size:25px}.opp-next{align-items:stretch;flex-direction:column}.opp-next .b{width:100%}.tabs-wrap{top:54px;margin-bottom:13px}.tabs{border-radius:12px;gap:3px}.tabs button{padding:9px 10px;font-size:12px}.card{padding:14px;border-radius:14px}.row{gap:7px}.row>button.b,.row>a.b{flex:1 1 auto}.board{grid-auto-columns:minmax(78vw,1fr)}.modal{padding:10px 8px}.modal>div{padding:16px;border-radius:15px}input,textarea,select{font-size:16px}label{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
html[data-theme=dark] .pill.Strong,html[data-theme=dark] .pill.good{background:#173a2b;color:#8fe0b5}
html[data-theme=dark] .pill.Good{background:#263723;color:#b8dc97}
html[data-theme=dark] .pill.Partial,html[data-theme=dark] .pill.warn{background:#3a2f14;color:#f0cb7a}
html[data-theme=dark] .pill.Poor,html[data-theme=dark] .pill.bad,html[data-theme=dark] .pill.crit{background:#3a1f1b;color:#f5a396}
html[data-theme=dark] .note{background:#2d2616;border-color:#5a4a1f;color:#ebd9a6}
html[data-theme=dark] .opp-stat{background:color-mix(in srgb,var(--opp-well) 55%,var(--opp-card))}
</style>

<body>
<main id="main">
  <header class="op-head">
    <div>
      <div class="op-eyebrow">Career workspace</div>
      <h1>Internship tracker</h1>
      <p class="sub">Find opportunities, check your fit, prepare your application, and keep every follow-up in one place. You approve every message and submit every application yourself.</p>
    </div>
    <div class="op-flow" aria-label="Opportunity workflow"><span>Discover</span><i>→</i><span>Evaluate</span><i>→</i><span>Prepare</span><i>→</i><span>Apply</span></div>
  </header>
  <div id="hero"></div>
  <div class="tabs-wrap"><div class="tabs" role="tablist" aria-label="Internship workspace sections" id="tabs"></div></div>
  <section id="view" aria-live="polite" aria-busy="true"></section>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Opportunity details"><div id="mbody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="opai-shell.js" defer></script>
<script src="guide.js" defer></script>
<script>
(function(){
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
var API=(storageGet('opa_api_base')||(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8000':'https://opa-52ug.onrender.com')).replace(/\/+$/,'');
var uid=null,userPromise=null,renderVersion=0,modalReturnFocus=null;
var TABS=[['today','Today’s Matches'],['saved','Saved Opportunities'],['apps','Applications'],['prof','Professor Outreach'],['programs','Programs & Challenges'],['email','Email & Follow-ups'],['docs','Documents'],['reports','Reports']];
var tab=(location.hash||'#today').slice(1);if(!TABS.some(function(t){return t[0]===tab}))tab='today';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeHref(value){var raw=String(value==null?'':value).trim();if(!raw)return '';try{var u=new URL(raw,location.href);if(u.protocol!=='http:'&&u.protocol!=='https:')return '';return esc(u.href)}catch(e){return ''}}
function hostLabel(value){try{return esc(new URL(value).hostname.replace(/^www\./i,''))}catch(e){return 'Official page'}}
function toast(m){var t=$('toast');t.textContent=String(m||'Something went wrong.');t.style.display='block';t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none';t.classList.remove('show')},3800)}
async function api(path,opt){opt=opt||{};var q=path+(path.indexOf('?')<0?'?':'&')+'user_id='+encodeURIComponent(uid),r;
  try{r=await fetch(API+q,{method:opt.method||'GET',headers:Object.assign({'Content-Type':'application/json'},opt.headers||{}),body:opt.body?JSON.stringify(Object.assign({user_id:uid},opt.body)):undefined})}
  catch(e){throw new Error('Could not reach OPAI. Check your connection and API URL, then try again.')}
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){var m=d&&d.detail;if(Array.isArray(m))m=m.map(function(x){return x.msg||x.loc&&x.loc.join('.')||'Invalid field'}).join('; ');throw new Error(typeof m==='string'?m:('Request failed ('+r.status+'). Please try again.'))}return d}
function post(p,b){return api(p,{method:'POST',body:b||{}})}
async function ensureUser(){if(uid)return uid;if(userPromise)return userPromise;
  userPromise=(async function(){var e=storageGet('opai_sc_email');if(!e){location.replace('app.html');throw new Error('Please sign in to open your internship workspace.')}
    var r;try{r=await fetch(API+'/v1/auth/dev-login?email='+encodeURIComponent(e.trim()),{method:'POST'})}catch(x){throw new Error('Could not reach OPAI sign-in. Check your connection and try again.')}
    var d=null;try{d=await r.json()}catch(x){}if(!r.ok||!d||!d.user_id)throw new Error((d&&d.detail)||'Your session could not be verified. Please sign in again.');uid=d.user_id;return uid})();
  try{return await userPromise}finally{userPromise=null}}

function stagger(root){var n=0;root.querySelectorAll(':scope > *, .board .col, .col .card, #fc_out > .card').forEach(function(el){el.style.setProperty('--i',Math.min(n++,14))})}
function countUp(root){root.querySelectorAll('[data-n]').forEach(function(el){var to=+el.dataset.n,t0=null;if(!to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to;return}
  function step(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(step)}requestAnimationFrame(step)})}
var METER={Strong:92,Good:68,Partial:38,Unclear:22,Poor:10};
function modal(html){
  if(!$('modal').classList.contains('on'))modalReturnFocus=document.activeElement;
  $('mbody').innerHTML=html;$('modal').classList.add('on');
  var title=$('mbody').querySelector('h2');if(title){title.id='opp-modal-heading';$('modal').setAttribute('aria-labelledby','opp-modal-heading')}
  var focusable=$('mbody').querySelector('input:not([type=hidden]),textarea,select,button,a[href]');if(focusable)setTimeout(function(){try{focusable.focus({preventScroll:true})}catch(e){}},0);
}
function closeModal(){$('modal').classList.remove('on');if(modalReturnFocus&&modalReturnFocus.isConnected){try{modalReturnFocus.focus({preventScroll:true})}catch(e){}}modalReturnFocus=null}
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});
$('modal').addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();closeModal()}});
function fmt(d){return d?esc(d):'<span class="mut">Not stated</span>'}
function list(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<div class="mut">None listed</div>'}

/* ---------- overview / summary ---------- */
async function hero(){
  try{
    var s=await api('/v1/opp/summary'),n=s.recommended_next_action;
    function metric(key,label,help){var val=Number(s[key]);if(!Number.isFinite(val)||val<0)val=0;
      return '<div class="opp-stat"><span class="opp-stat-label">'+label+'</span><strong data-n="'+val+'">0</strong><small>'+help+'</small></div>'}
    var nextLink=n&&safeHref(n.link);
    $('hero').innerHTML='<div class="card opp-hero"><div class="opp-hero-top"><div><div class="opp-section-kicker">Your search pulse</div><h2>Opportunity overview</h2><p class="mut">A quick view of what needs your attention.</p></div><button class="b alt" id="bprof" type="button">Edit my profile</button></div>'+
      '<div class="opp-stats">'+metric('strong_to_review','Strong matches','Ready for your review')+metric('deadlines_this_week','Deadlines this week','Roles and applications')+metric('applications_waiting_for_you','In preparation','Applications not submitted')+metric('professors_with_research_match','Research matches','Professor briefs available')+metric('drafts_awaiting_approval','Drafts to approve','Nothing sends automatically')+metric('followups_due','Follow-ups due','Replies are checked by you')+
      (Number(s.programs_live)>0?metric('programs_live','Live programs','Open or active cycles'):'')+(Number(s.programs_to_verify)>0?metric('programs_to_verify','Programs to verify','Check official dates'):'')+'</div>'+
      '<div class="opp-next"><div class="opp-next-copy"><span class="opp-next-title">Recommended next step</span><p>'+(n?esc(n.text):'You’re all caught up. Save an opportunity or confirm your profile to get started.')+'</p></div>'+
      (n&&nextLink?'<a class="b alt" href="'+nextLink+'">Open next step</a>':'<a class="b alt" href="#saved">Explore opportunities</a>')+'</div></div>';
    $('bprof').onclick=function(){profileModal().catch(function(e){toast(e.message)})};countUp($('hero'))
  }catch(e){$('hero').innerHTML='<div class="card"><div class="row sp"><div><h2>Opportunity overview</h2><p class="mut">Your summary is temporarily unavailable. You can still use the sections below.</p></div><button class="b alt" id="bprof" type="button">Edit my profile</button></div></div>';var b=$('bprof');if(b)b.onclick=function(){profileModal().catch(function(e){toast(e.message)})}}
}

/* ---------- profile ---------- */
async function profileModal(){
  var v=await api('/v1/opp/profile'),p=v.profile;
  function f(k,l,ph){var type='text';if(k==='year'||k==='cgpa')type='number';else if(k==='graduation_date')type='month';else if(k==='available_from'||k==='available_to')type='date';else if(k==='resume_url'||k==='portfolio_url'||k==='github_url')type='url';
    var limits=k==='year'?' min="1" max="6" step="1"':(k==='cgpa'?' min="0" max="10" step="0.01"':'');
    return '<label>'+l+'<input id="pf_'+k+'" type="'+type+'"'+limits+' value="'+esc(Array.isArray(p[k])?p[k].join(', '):(p[k]==null?'':p[k]))+'" placeholder="'+esc(ph||'')+'"></label>'}
  modal('<h2>Opportunity profile</h2><p class="mut">Matching only uses what you confirm here. OPAI does not guess eligibility details like work authorization.</p>'+
    (v.is_confirmed?'<div class="pill good">Confirmed</div>':'<div class="note">Not confirmed yet. Matches are provisional until you confirm.</div>')+
    '<div class="grid">'+f('degree','Degree','B.Tech')+f('year','Year of study (1-4)','2')+f('branch','Branch')+f('college','College')+f('graduation_date','Graduation (YYYY-MM)','2029-05')+f('cgpa','CGPA')+
    f('skills','Skills (comma separated)')+f('role_types','Roles (internship, research, part-time)')+f('locations','Locations')+f('work_modes','Work modes (remote, hybrid, onsite)')+
    f('available_from','Available from','2026-12-01')+f('available_to','Available to')+f('resume_url','Resume link')+f('portfolio_url','Portfolio link')+f('github_url','GitHub link')+'</div>'+
    f('eligibility_notes','Eligibility limits (anything the posting might ask)')+f('communication_style','Preferred communication style')+
    '<div class="row" style="margin-top:12px"><button class="b" id="pfsave">Save & confirm</button><button class="b alt" id="pfx">Cancel</button></div>');
  $('pfx').onclick=closeModal;
  $('pfsave').onclick=async function(){
    var body={confirm:true},num={year:1,cgpa:1},arr={skills:1,role_types:1,locations:1,work_modes:1};
    ['degree','year','branch','college','graduation_date','cgpa','skills','role_types','locations','work_modes','available_from','available_to','resume_url','portfolio_url','github_url','eligibility_notes','communication_style'].forEach(function(k){
      var x=$('pf_'+k).value.trim();body[k]=arr[k]?(x?x.split(',').map(function(s){return s.trim()}).filter(Boolean):[]):(num[k]?(x?Number(x):null):(x||null))});
    try{await api('/v1/opp/profile',{method:'PUT',body:body});closeModal();toast('Profile confirmed');render()}catch(e){toast(e.message)}}}

/* ---------- brief card ---------- */
function briefCard(o){
  var b=o.brief||o;var full=!!b.signals;var id=o.id||b.opportunity_id;
  var h='<div class="card"><div class="row sp"><h3>'+esc(o.title)+' <span class="mut">· '+esc(o.organization)+'</span></h3><span class="pill '+esc(b.match)+'">Match: '+esc(b.match)+'</span></div>'+
    '<div class="row mut" style="margin-top:4px"><span>Deadline: '+fmt(o.deadline||b.deadline)+'</span>'+(b.days_left!=null?'<span>('+b.days_left+' days)</span>':'')+'<span>Prep ~'+b.estimated_prep_minutes+' min</span></div>'+
    '<div class="meter" title="Match strength"><i style="--w:'+(METER[b.match]||20)+'%"></i></div><div style="margin-top:6px"><b>Eligibility:</b> '+esc(b.eligibility.summary)+'</div>';
  if(full){h+='<div class="sig"><b>Verified facts</b>'+list(b.signals.verified_facts.map(function(x){return x.field+': '+x.value+' ('+x.basis+')'}))+'</div>'+
    '<div class="sig"><b>Profile match</b>'+list(b.signals.profile_match)+'</div><div class="sig"><b>Gaps (not shown in your profile)</b>'+list(b.match_detail.gaps)+'</div>'+
    '<div class="sig"><b>Unknown, needs your check</b>'+list(b.signals.unknown)+'</div><div class="sig"><b>AI suggestion (not a fact)</b>'+list(b.signals.ai_suggestions)+'</div>'}
  h+='<p style="margin:8px 0"><b>Next step:</b> '+esc(b.recommended_next_step)+'</p><div class="row">'+
    (safeHref(o.source_url)?'<a class="b alt" target="_blank" rel="noopener noreferrer" href="'+safeHref(o.source_url)+'">Open source</a>':'')+
    '<button class="b" data-a="track" data-id="'+esc(id)+'">Track opportunity</button>'+(full?'':'<button class="b alt" data-a="brief" data-id="'+esc(id)+'">Full brief</button>')+
    '<button class="b alt" data-a="verified" data-id="'+esc(id)+'">I re-checked the source</button><button class="b dng" data-a="dismiss" data-id="'+esc(id)+'">Not interested</button></div></div>';
  return h}

async function oppAction(a,id){
  try{
    if(a==='track'){await post('/v1/opp/opportunities/'+id+'/track');toast('Tracking. See Applications.');location.hash='#apps';tab='apps';render();return}
    if(a==='dismiss'){await post('/v1/opp/opportunities/'+id+'/dismiss');toast('Dismissed')}
    if(a==='verified'){await post('/v1/opp/opportunities/'+id+'/verified');toast('Marked as re-checked today')}
    if(a==='brief'){var b=await api('/v1/opp/opportunities/'+id+'/brief');modal(briefCard(Object.assign({id:id,title:b.title,organization:b.organization,deadline:b.deadline,source_url:b.source.url},{brief:b}))+'<button class="b alt" id="mx">Close</button>');$('mx').onclick=closeModal;return}
    render()}catch(e){toast(e.message)}}

var pgFilter='';
var PGCLS={'Open':'good','Active':'good','Opens soon':'warn','Upcoming':'warn','Verify current cycle':'warn','Not announced':'','Closed':'bad','Ended':'bad'};
function pgCard(p){var c=p.cycle,src=c.source||{};
  var dates=[c.applications_open?'Opens '+c.applications_open:'',c.deadline?'Deadline '+c.deadline:'',c.event_start?'Runs '+c.event_start+(c.event_end?' to '+c.event_end:''):''].filter(Boolean).join(' · ');
  return '<div class="card"><div class="row sp"><b>'+esc(p.name)+' \u2014 '+esc(c.label)+'</b><span class="pill '+(PGCLS[c.status]||'')+'">'+esc(c.status)+'</span></div>'+
   '<div class="mut">Type: '+esc(p.type_label)+(p.organizer?' · '+esc(p.organizer):'')+'</div>'+
   (dates&&c.confirmed?'<div style="margin-top:4px">'+esc(dates)+'</div>':'')+
   '<div style="margin-top:4px"><b>Eligibility:</b> '+esc(c.eligibility)+'</div>'+
   '<div style="margin-top:4px"><b>Next step:</b> '+esc(p.next_step)+'</div>'+
   (p.fit&&p.fit.level!=='unknown'?'<div class="mut" style="margin-top:4px">Why it may fit: '+esc(p.fit.why)+'</div>':'')+
   '<div class="mut" style="margin-top:4px">Official source: '+(safeHref(p.official_url)?'<a target="_blank" rel="noopener noreferrer" href="'+safeHref(p.official_url)+'">'+hostLabel(p.official_url)+'</a>':'Not provided or invalid')+' · Last checked: '+esc(src.last_checked||'Not checked yet')+(c.needs_reverify?' <span class="pill warn">re-check</span>':'')+'</div>'+
   '<div class="mut">'+esc(c.status_why)+'</div>'+
   (p.next_cycle?'<div class="note" style="margin-top:6px"><b>Next announced cycle:</b> '+esc(p.next_cycle.status)+'. '+esc(p.next_cycle.next_step)+'</div>':'')+
   '<div class="row" style="margin-top:8px">'+(safeHref(p.official_url)?'<a class="b alt" target="_blank" rel="noopener noreferrer" href="'+safeHref(p.official_url)+'">View official page</a>':'')+
   (c.status==='Closed'||c.status==='Ended'?(p.next_cycle?'<button class="b" data-pg="nextcycle" data-id="'+esc(p.id)+'">Add next cycle</button>':''):'<button class="b" data-pg="plan" data-id="'+esc(c.id)+'">Add to my plan</button>')+
   '<button class="b alt" data-pg="confirm" data-id="'+esc(c.id)+'">Confirm dates & rules</button><button class="b alt" data-pg="track" data-id="'+esc(c.id)+'" data-cur="'+esc(c.participation)+'">Track participation ('+esc(c.participation)+')</button><button class="b dng" data-pg="remove" data-id="'+esc(p.id)+'">Remove</button></div></div>'}

    '<div class="card"><h2>By source</h2>'+(Object.keys(r.by_source).map(function(k){var x=r.by_source[k];return '<div>'+esc(k.replace(/_/g,' '))+': '+x.tracked+' tracked, '+x.applied+' applied, '+x.responses+' responses</div>'}).join('')||'<span class="mut">No data yet</span>')+'</div>'+
    '<div class="card"><h2>Bottlenecks</h2>'+list(r.bottlenecks)+'<div class="mut">'+esc(r.note)+'</div></div>'}
};

document.addEventListener('click',async function(e){
  var t=e.target.closest('button,[data-open]');if(!t)return;
  try{
  if(t.dataset.pg){var g=t.dataset.pg,id=t.dataset.id;
    if(g==='addcat'){var o=await post('/v1/opp/programs',{catalog_id:id});toast(o.name+' added. Confirm its current cycle on the official page.');return render()}
    if(g==='addcustom'){var o2=await post('/v1/opp/programs',{name:$('pg_name').value,program_type:$('pg_ptype').value,official_url:$('pg_url').value,organizer:$('pg_org').value||null});toast(o2.name+' added.');return render()}
    if(g==='plan'){var r=await post('/v1/opp/programs/cycles/'+id+'/plan');toast(r.created.length?('Added '+r.created.length+' task(s) to Today.'):'Already in your plan.');return render()}
    if(g==='confirm')return pgConfirmModal(id);
    if(g==='track')return pgTrackModal(id,t.dataset.cur);
    if(g==='nextcycle'){var yr=new Date().getFullYear()+1;await post('/v1/opp/programs/'+id+'/cycles',{label:'Next announced cycle',year:yr,announced:false});toast('Added. It will say Not announced until you confirm it.');return render()}
    if(g==='remove'){if(!confirm('Remove this program and its unfinished preparation tasks?'))return;await api('/v1/opp/programs/'+id,{method:'DELETE'});toast('Removed.');return render()}
  }
  if(t.dataset.a)return oppAction(t.dataset.a,t.dataset.id);
  if(t.dataset.open)return appModal(t.dataset.open);
  if(t.id==='fc_go'){facLimit=20;return facSearch()}
  if(t.id==='fc_more'){facLimit+=30;return facSearch()}
  if(t.dataset.fadd){var c=await post('/v1/opp/faculty/add',{faculty_id:t.dataset.fadd});toast(c.next);return render()}
  if(t.id==='in_go')return intake();
  if(t.id==='in_email')return emailIntake();
  if(t.id==='pr_add'){await post('/v1/opp/professors',{name:$('pr_name').value,institute:$('pr_inst').value,source_url:$('pr_url').value||null,email:$('pr_email').value||null,email_shown_on_source:$('pr_shown').checked,research_areas:$('pr_areas').value.split(',').map(function(s){return s.trim()}).filter(Boolean),relevant_work:$('pr_work').value||null});toast('Added');return render()}
  if(t.dataset.pa==='brief'){var b=await post('/v1/contacts/'+t.dataset.id+'/research-brief');modal('<h2>Research brief</h2><p><b>Verification:</b> '+esc(b.verification)+' · relevance '+esc(b.relevance)+'</p><pre class="mail">'+esc(JSON.stringify(b,null,2))+'</pre><button class="b alt" id="mx">Close</button>');$('mx').onclick=closeModal;return render()}
  if(t.dataset.pa==='draft'){var d=await post('/v1/contacts/'+t.dataset.id+'/draft-email');toast('Draft created. Nothing was sent.');tab='email';location.hash='#email';return render()}
  if(t.dataset.fu){var r=await post('/v1/opp/followups/'+t.dataset.k+'/'+t.dataset.id+'/answer',{answer:t.dataset.fu});toast(r.note||r.next||('Done: '+r.result));return render()}
  if(t.dataset.ob==='reject'){await post('/v1/opp/outbox/'+t.dataset.id+'/reject');return render()}
  if(t.dataset.ob==='gsend'){return sendViaGmail(t.dataset.id)}
  if(t.dataset.ob==='sent'){await post('/v1/opp/outbox/'+t.dataset.id+'/sent',{});toast('Logged. Follow-up scheduled.');return render()}

  }catch(err){toast(err.message)}});

var facLimit=20;
async function facSearch(){
  var out=$('fc_out');if(!out)return;var q=($('fc_q').value||'').trim(),inst=$('fc_inst').value;
  out.innerHTML='<div class="mut">Searching…</div>';
  try{var r=await api('/v1/opp/faculty/search?q='+encodeURIComponent(q)+(inst?'&institute='+encodeURIComponent(inst):'')+'&limit='+facLimit);
    var sel=$('fc_inst');if(sel.options.length<2)r.institutes.forEach(function(i){var o=document.createElement('option');o.textContent=i;sel.appendChild(o)});sel.value=inst;
    if(!r.items.length){out.innerHTML='<div class="note">'+esc(r.note||'No matches. Try different research terms.')+'</div>';return}
    out.innerHTML='<div class="mut">'+(r.browse?'All professors ('+r.total+'), A-Z':(r.auto?'Recommended for you, based on: ':'Results for: ')+esc(String(r.query_used||'your profile').slice(0,120)))+'</div>'+r.items.map(function(f){
      return '<div class="card" style="margin:8px 0"><div class="row sp"><b>'+esc(f.name)+' <span class="mut">· '+esc(f.institute)+(f.department?', '+esc(f.department):'')+(f.designation?' · '+esc(f.designation):'')+'</span></b><span class="pill">'+f.score+'% match</span></div>'+
      '<div class="mut">'+esc(f.research_areas.join(', ')||'No research areas listed')+'</div><div class="mut">'+esc(f.why)+'</div>'+
      '<div class="row" style="margin-top:6px">'+(safeHref(f.website)?'<a class="b alt" target="_blank" rel="noopener noreferrer" href="'+safeHref(f.website)+'">Their page</a>':'')+
      (f.already_added?'<span class="pill good">In your contacts</span>':'<button class="b" data-fadd="'+esc(f.id)+'">Add to contacts</button>')+'</div></div>'}).join('')+(r.browse&&r.total>r.items.length?'<button class="b alt" id="fc_more">Show more ('+(r.total-r.items.length)+' left)</button> ':'')+'<div class="mut">'+esc(r.note)+'</div>';stagger(out)
  }catch(e){out.innerHTML='<div class="note">'+esc(e.message)+'</div>'}}

async function intake(){
  var url=$('in_url').value.trim(),text=$('in_text').value.trim();
  try{
    var pv=await post('/v1/opp/intake/preview',{url:url||null,text:text||null}),f=pv.fields||{};
    function field(k,l,placeholder){var item=f[k]||{},v=item.value,conf=item.confidence||'missing',type=k==='deadline'?'date':'text';
      if(Array.isArray(v))v=v.join(', ');return '<label>'+l+' <span class="pill '+(conf==='stated'?'good':'warn')+'">'+esc(conf)+'</span><input id="cf_'+k+'" type="'+type+'" value="'+esc(v==null?'':v)+'" placeholder="'+esc(placeholder||'')+'"></label>'}
    var req=f.requirements&&Array.isArray(f.requirements.value)?f.requirements.value.join('\n'):'';
    var tags=f.tags&&Array.isArray(f.tags.value)?f.tags.value.join(', '):'';
    var dups=Array.isArray(pv.possible_duplicates)?pv.possible_duplicates:[],src=safeHref(pv.source_url);
    modal('<h2>Review opportunity</h2><div class="note">'+esc(pv.message||'Check the extracted details before saving.')+(src?' <a target="_blank" rel="noopener noreferrer" href="'+src+'">Open source ↗</a>':'')+'</div>'+
      (dups.length?'<div class="note">Possible duplicate: <b>'+esc(dups[0].title||'Existing role')+'</b>'+(dups[0].company?' at '+esc(dups[0].company):'')+'. Check before saving another copy.</div>':'')+
      '<div class="grid">'+field('title','Role title','e.g. Machine Learning Intern')+field('company','Company / organization','e.g. Example AI')+field('location','Location','Remote, Hyderabad…')+field('work_mode','Work mode','remote, hybrid, onsite')+field('deadline','Application deadline')+field('role_type','Opportunity type','internship, research, part-time…')+field('tags','Skills / tags (comma separated)','Python, RAG, FastAPI')+'</div>'+
      '<label>Requirements / eligibility <textarea id="cf_req" placeholder="One requirement per line">'+esc(req)+'</textarea></label>'+
      '<div class="row" style="margin-top:12px"><button class="b" id="cf_ok" type="button">Confirm and save</button><button class="b alt" id="cf_x" type="button">Cancel</button></div>');
    $('cf_x').onclick=closeModal;
    $('cf_ok').onclick=async function(){
      var btn=$('cf_ok'),g=function(k){var el=$('cf_'+k);return el?el.value.trim():''};
      if(!g('title')||!g('company')){toast('Add both a role title and company before saving.');return}
      var requirementList=$('cf_req').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),tagList=g('tags').split(',').map(function(x){return x.trim()}).filter(Boolean);
      var extracted=Object.keys(f).filter(function(k){var v=f[k]&&f[k].value;return v!=null&&v!==''&&(!Array.isArray(v)||v.length>0)});
      var confirmed=['title','company','location','work_mode','deadline','role_type'].filter(function(k){return !!g(k)});
      if(requirementList.length)confirmed.push('requirements');if(tagList.length)confirmed.push('tags');
      btn.disabled=true;btn.textContent='Saving…';
      try{var r=await post('/v1/opp/intake/confirm',{title:g('title'),company:g('company'),location:g('location')||null,work_mode:g('work_mode')?g('work_mode').toLowerCase():null,deadline:g('deadline')||null,role_type:g('role_type')||'internship',
        source_url:pv.source_url,source_type:pv.source_type,description_text:pv.description_text,requirements:requirementList,tags:tagList,confirmed_fields:confirmed,extracted_fields:extracted});
        closeModal();toast('Opportunity saved. Match: '+((r.brief&&r.brief.match)||'Review it next'));tab='saved';location.hash='#saved';render()}
      catch(err){btn.disabled=false;btn.textContent='Confirm and save';toast(err.message)}};
  }catch(err){toast(err.message)}
}

async function emailIntake(){
  modal('<h2>Import a job-alert email</h2><p class="mut">Paste a LinkedIn job-alert email. OPAI only reads the text you paste here; it never opens your inbox.</p><textarea id="em_text" style="min-height:160px" placeholder="Paste the email text, including the job links…"></textarea><div class="row" style="margin-top:10px"><button class="b" id="em_go" type="button">Find roles</button><button class="b alt" id="em_x" type="button">Cancel</button></div><div id="em_out"></div>');
  $('em_x').onclick=function(){closeModal();if(tab==='saved')render()};
  $('em_go').onclick=async function(){var btn=$('em_go');if(!$('em_text').value.trim()){toast('Paste the job-alert email text first.');return}btn.disabled=true;btn.textContent='Finding roles…';
    try{var r=await post('/v1/opp/intake/email-preview',{text:$('em_text').value});var candidates=Array.isArray(r.candidates)?r.candidates:[];
      $('em_out').innerHTML=candidates.length?candidates.map(function(c,i){var src=safeHref(c.source_url),dups=Array.isArray(c.possible_duplicates)?c.possible_duplicates:[];
        return '<div class="card" data-ei-card="'+i+'"><div class="row sp"><div><b>'+esc(c.title||'Title needs review')+'</b><div class="mut">'+esc(c.company||'Organization needs review')+(c.location?' · '+esc(c.location):'')+'</div></div><span class="pill warn">Needs review</span></div>'+
          (dups.length?'<div class="note">Possible duplicate: '+esc(dups[0].title||'an existing role')+'.</div>':'')+
          '<div class="row" style="margin-top:8px">'+(src?'<a class="b alt" target="_blank" rel="noopener noreferrer" href="'+src+'">Open LinkedIn</a>':'')+'<button class="b" type="button" data-ei-open="'+i+'">Review & track</button></div>'+
          '<div class="ei-editor" id="ei_editor_'+i+'" hidden><div class="grid" style="margin-top:10px"><label>Role title<input id="ei_title_'+i+'" value="'+esc(c.title||'')+'" placeholder="Role title"></label><label>Company<input id="ei_company_'+i+'" value="'+esc(c.company||'')+'" placeholder="Company or lab"></label><label>Location<input id="ei_location_'+i+'" value="'+esc(c.location||'')+'" placeholder="Remote / city"></label></div><div class="row" style="margin-top:8px"><button class="b" type="button" data-ei-save="'+i+'">Confirm & save</button><button class="b alt" type="button" data-ei-cancel="'+i+'">Cancel</button></div></div></div>'}).join(''):'<div class="note">No LinkedIn job links found. Paste the email body with its job links and try again.</div>';
      $('em_out').querySelectorAll('[data-ei-open]').forEach(function(b){b.onclick=function(){var i=b.dataset.eiOpen,ed=$('ei_editor_'+i);ed.hidden=false;b.hidden=true;var field=$('ei_title_'+i);if(field)field.focus()}});
      $('em_out').querySelectorAll('[data-ei-cancel]').forEach(function(b){b.onclick=function(){var i=b.dataset.eiCancel,ed=$('ei_editor_'+i),open=$('em_out').querySelector('[data-ei-open="'+i+'"]');ed.hidden=true;if(open)open.hidden=false}});
      $('em_out').querySelectorAll('[data-ei-save]').forEach(function(b){b.onclick=async function(){var i=b.dataset.eiSave,title=$('ei_title_'+i).value.trim(),company=$('ei_company_'+i).value.trim(),loc=$('ei_location_'+i).value.trim();
        if(!title||!company){toast('Enter both the role title and company to continue.');return}b.disabled=true;b.textContent='Saving…';
        try{await post('/v1/opp/intake/confirm',{title:title,company:company,source_url:candidates[+i].source_url,source_type:'email_alert',location:loc||null,extracted_fields:['title','company'],confirmed_fields:['title','company'].concat(loc?['location']:[]),allow_duplicate:false});
          b.textContent='Saved';b.classList.add('alt');toast('Saved after your review. You can review another role.');var card=$('em_out').querySelector('[data-ei-card="'+i+'"]');var badge=card&&card.querySelector('.pill');if(badge){badge.textContent='Saved';badge.className='pill good'}
        }catch(err){b.disabled=false;b.textContent='Confirm & save';toast(err.message)}}});
    }catch(err){toast(err.message)}finally{btn.disabled=false;btn.textContent='Find roles'}}}

async function appModal(id){
  var a=await api('/v1/opp/applications/'+id);
  var opts=['Saved','Reviewing','Preparing','Ready to submit','Applied','Assessment','Interview','Offer','Rejected','Withdrawn'].map(function(s){return '<option'+(s===a.stage?' selected':'')+'>'+s+'</option>'}).join('');
  modal('<h2>'+esc(a.role)+' <span class="mut">· '+esc(a.company)+'</span></h2><div class="row"><span class="pill">'+esc(a.stage)+'</span>'+(safeHref(a.link)?'<a class="b alt" target="_blank" rel="noopener noreferrer" href="'+safeHref(a.link)+'">Open original posting</a>':'')+'</div>'+
    '<h3 style="margin-top:12px">Checklist</h3>'+a.checklist.map(function(c){return '<div>'+(c.done?'\u2611':'\u2610')+' '+esc(c.item)+'</div>'}).join('')+
    '<label>Move to stage</label><select id="as_st">'+opts+'</select><label style="font-weight:500"><input type="checkbox" id="as_sub" style="width:auto"> I submitted this on the original site myself (required for Applied)</label>'+
    '<label>Note</label><input id="as_note"><label>Recruiter / referral email (for follow-ups)</label><input id="as_ref" value="'+esc(a.contact_ref||'')+'">'+
    '<div class="row" style="margin-top:10px"><button class="b" id="as_go">Update</button><button class="b alt" id="as_x">Close</button></div>'+
    '<h3 style="margin-top:14px">History</h3>'+(a.history.map(function(h){return '<div class="mut">'+esc((h.at||'').slice(0,10))+' · '+esc(h.from||'')+(h.to?' → '+esc(h.to):'')+' '+esc(h.note||'')+'</div>'}).join('')));
  $('as_x').onclick=closeModal;
  $('as_go').onclick=async function(){try{
    if($('as_ref').value.trim()!==(a.contact_ref||''))await api('/v1/opp/applications/'+id+'/prep',{method:'PUT',body:{contact_ref:$('as_ref').value.trim()}});
    if($('as_st').value!==a.stage)await post('/v1/opp/applications/'+id+'/stage',{to:$('as_st').value,note:$('as_note').value||null,user_confirms_submitted:$('as_sub').checked});
    closeModal();render()}catch(err){toast(err.message)}}}

var gcfg=null;
async function gmailCfg(){if(gcfg)return gcfg;try{gcfg=await api('/v1/opp/config')}catch(e){gcfg={gmail_send_enabled:false}}return gcfg}
function gmailToken(cfg){return new Promise(function(res,rej){
  function go(){try{google.accounts.oauth2.initTokenClient({client_id:cfg.google_client_id,scope:cfg.gmail_scope,callback:function(r){r&&r.access_token?res(r.access_token):rej(new Error('Gmail permission was not granted.'))},error_callback:function(){rej(new Error('Gmail sign-in was cancelled.'))}}).requestAccessToken()}catch(e){rej(new Error('Could not start Google sign-in.'))}}
  if(window.google&&google.accounts&&google.accounts.oauth2)return go();
  var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=go;sc.onerror=function(){rej(new Error('Could not load Google sign-in.'))};document.head.appendChild(sc)})}
async function sendViaGmail(id){var cfg=await gmailCfg();if(!cfg.gmail_send_enabled){toast('Gmail sending is not set up. Use Open in Gmail instead.');return}
  try{var tok=await gmailToken(cfg);var r=await api('/v1/opp/outbox/'+id+'/send',{method:'POST',body:{},headers:{'X-Gmail-Token':tok}});toast('Sent through Gmail. Follow-up scheduled for '+r.follow_up_date+'.');closeModal();render()}catch(err){toast(err.message)}}
async function reviewModal(id){
  var r=await api('/v1/opp/outbox/'+id+'/review');var ri=r.recipient;
  modal('<h2>Review before approving</h2><div class="mut">Approval covers exactly this message. If anything changes, you will need to review again.</div>'+
    '<p><b>To:</b> '+esc(ri.to||'(none)')+' <span class="pill '+(ri.verification==='unverified'?'warn':'good')+'">'+esc(ri.verification.replace(/_/g,' '))+'</span></p>'+(safeHref(ri.source)?'<div class="mut">Source: <a target="_blank" rel="noopener noreferrer" href="'+safeHref(ri.source)+'">'+esc(ri.source)+'</a> · checked '+esc(ri.source_checked_on||'?')+'</div>':'')+
    '<p><b>Sending account:</b> '+esc(r.sending_account)+'</p><p><b>Subject</b></p><input id="rv_sub" value="'+esc(r.subject||'')+'"><p><b>Body</b></p><textarea id="rv_body" style="min-height:200px">'+esc(r.body||'')+'</textarea>'+
    (r.attachments.length?'<p><b>Attachments:</b> '+esc(r.attachments.join(', '))+'</p>':'')+r.warnings.map(function(w){return '<div class="note">'+esc(w)+'</div>'}).join('')+
    '<div class="mut">Follow-up scheduled: '+esc(r.follow_up_if_sent)+'</div>'+(ri.verification==='unverified'?'<label style="font-weight:500"><input type="checkbox" id="rv_conf" style="width:auto"> I checked this email address</label>':'')+
    '<div class="row" style="margin-top:10px"><button class="b alt" id="rv_save">Save edits</button><button class="b" id="rv_ok">Approve this exact message</button><button class="b alt" id="rv_x">Close</button></div>');
  $('rv_x').onclick=closeModal;
  $('rv_save').onclick=async function(){try{await api('/v1/opp/outbox/'+id,{method:'PATCH',body:{subject:$('rv_sub').value,body:$('rv_body').value}});toast('Saved. Review again to approve.');reviewModal(id)}catch(err){toast(err.message)}};
  $('rv_ok').onclick=async function(){
    if($('rv_sub').value!==(r.subject||'')||$('rv_body').value!==(r.body||'')){toast('You edited the text. Press Save edits, then review again.');return}
    try{var a=await post('/v1/opp/outbox/'+id+'/approve',{reviewed_hash:r.payload_hash,confirm_recipient:!!($('rv_conf')&&$('rv_conf').checked)});
      var gc=await gmailCfg();modal('<h2>Approved</h2><p>'+esc(a.message)+'</p><div class="mut">Send with Gmail uses a send-only permission. OPAI cannot read your inbox.</div><div class="row">'+(gc.gmail_send_enabled?'<button class="b" id="gs">Send with Gmail</button>':'')+'<a class="b'+(gc.gmail_send_enabled?' alt':'')+'" target="_blank" rel="noopener noreferrer" href="'+esc(a.compose_url)+'">Open in Gmail</a><button class="b alt" id="mx">Close</button></div>');if($('gs'))$('gs').onclick=function(){sendViaGmail(id)};$('mx').onclick=function(){closeModal();render()}}catch(err){toast(err.message)}}}

render();
})();
</script>
