<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opportunities · OPAI</title>
<meta name="theme-color" content="#F6F4EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opai-shared.css">
<style>
:root{--bg:#F6F4EE;--card:#fff;--ink:#16181A;--mut:#5a6064;--pri:#17504A;--coral:#E8705A;--line:#e3e0d6;--warn:#b4580f;--bad:#b3261e;--good:#17704a;--font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/22px var(--font);min-height:100vh}
main{max-width:1080px;margin:0 auto;padding:20px 16px 140px}
h1{font-size:28px;letter-spacing:-.03em;margin:4px 0 2px;color:var(--pri)} h2{font-size:18px;margin:0 0 10px} h3{font-size:15px;margin:0}
.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;font:500 14px var(--font);color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:600 12px/18px var(--font);background:#eef2f0;color:var(--pri)}
.pill.Strong,.pill.good{background:#dff3e8;color:var(--good)}.pill.Good{background:#e8f3df;color:#3c6b17}.pill.Partial,.pill.warn{background:#fdecd9;color:var(--warn)}.pill.Poor,.pill.bad{background:#fbe0dd;color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
button.b,a.b{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:7px 12px;font:600 13px var(--font);cursor:pointer;text-decoration:none;display:inline-block}
button.b.alt,a.b.alt{background:#fff;color:var(--pri)} button.b.dng{background:#fff;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px var(--font);background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical} label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 3px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.sig{margin:8px 0}.sig b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}.sig ul{margin:4px 0 0;padding-left:18px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:#efece3;border-radius:12px;padding:8px}.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:2px 4px 8px}
.col .card{padding:10px;margin-bottom:8px;cursor:pointer}
.note{background:#fff7e6;border:1px solid #f1d9a6;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:90}.modal.on{display:flex}
.modal>div{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:18px}
pre.mail{white-space:pre-wrap;font:14px/21px var(--font);background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;display:none;z-index:99}

/* ---------- motion (all disabled under prefers-reduced-motion) ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(232,112,90,.55)}70%{box-shadow:0 0 0 9px rgba(232,112,90,0)}100%{box-shadow:0 0 0 0 rgba(232,112,90,0)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{width:0}to{width:var(--w)}}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#hero .card{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
#view>*,.board .col,.col .card,#fc_out>.card{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(23,80,74,.10);border-color:#cfd8d4}
.col .card:hover{transform:translateY(-2px) scale(1.01)}
.tabs button{transition:background .25s ease,color .25s ease,transform .15s ease}
.tabs button:hover{transform:translateY(-1px);color:var(--pri)}.tabs button[aria-selected=true]:hover{color:#fff}
.tabs button[aria-selected=true]{animation:tabIn .3s ease both}
button.b,a.b{transition:transform .15s ease,box-shadow .2s ease,background .2s ease,color .2s ease}
button.b:hover:not(:disabled),a.b:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(23,80,74,.22)}
button.b:active:not(:disabled),a.b:active{transform:scale(.96);box-shadow:none}
input,textarea,select{transition:border-color .2s ease,box-shadow .2s ease}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(23,80,74,.14)}
.modal.on{animation:fade .2s ease both}.modal.on>div{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.toast.show{animation:toastIn .3s ease both}
.pill.Strong{animation:pulseRing 1.8s ease-out 2 .6s}
.pill.crit{background:#fbe0dd;color:var(--bad);animation:pulseRing 1.6s ease-out infinite}
.meter{height:6px;border-radius:99px;background:#ebe8de;overflow:hidden;margin:8px 0 2px}
.meter i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--pri));animation:grow .9s cubic-bezier(.2,.8,.2,1) .15s both}
.skel{height:92px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,#ece9df 25%,#f6f4ee 37%,#ece9df 63%);background-size:800px 100%;animation:shimmer 1.3s linear infinite}
.sig li{animation:fade .5s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="main">
  <h1>Opportunities</h1>
  <p class="sub">Discover → Evaluate → Prepare → Apply or reach out → Follow up → Learn. You review and approve every message and every submission. OPAI never applies or emails for you.</p>
  <div id="hero"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="view"></section>
</main>
<div class="modal" id="modal"><div id="mbody"></div></div>
<div class="toast" id="toast"></div>
<script src="opai-shell.js" defer></script>
<script src="guide.js" defer></script>
<script>
(function(){
var API=(localStorage.getItem('opa_api_base')||(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8000':'https://opa-52ug.onrender.com')).replace(/\/+$/,'');
var uid=null;
var TABS=[['today','Today\u2019s Matches'],['saved','Saved Opportunities'],['apps','Applications'],['prof','Professor Outreach'],['programs','Programs & Challenges'],['email','Email & Follow-ups'],['docs','Documents'],['reports','Reports']];
var tab=(location.hash||'#today').slice(1);if(!TABS.some(function(t){return t[0]===tab}))tab='today';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none';t.classList.remove('show')},3500)}
async function api(path,opt){opt=opt||{};var q=path+(path.indexOf('?')<0?'?':'&')+'user_id='+encodeURIComponent(uid);
  var r=await fetch(API+q,{method:opt.method||'GET',headers:Object.assign({'Content-Type':'application/json'},opt.headers||{}),body:opt.body?JSON.stringify(Object.assign({user_id:uid},opt.body)):undefined});
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){var m=d&&d.detail;if(Array.isArray(m))m=m.map(function(x){return x.msg}).join('; ');throw new Error(m||('Request failed ('+r.status+')'))}return d}
function post(p,b){return api(p,{method:'POST',body:b||{}})}
async function ensureUser(){if(uid)return;var e=null;try{e=localStorage.getItem('opai_sc_email')}catch(x){}if(!e){location.replace('login.html');throw new Error('Please sign in')}var r=await fetch(API+'/v1/auth/dev-login?email='+encodeURIComponent(e),{method:'POST'});var d=await r.json();uid=d.user_id}

function stagger(root){var n=0;root.querySelectorAll(':scope > *, .board .col, .col .card, #fc_out > .card').forEach(function(el){el.style.setProperty('--i',Math.min(n++,14))})}
function countUp(root){root.querySelectorAll('[data-n]').forEach(function(el){var to=+el.dataset.n,t0=null;if(!to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to;return}
  function step(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(step)}requestAnimationFrame(step)})}
var METER={Strong:92,Good:68,Partial:38,Unclear:22,Poor:10};
function modal(html){$('mbody').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});
function fmt(d){return d?esc(d):'<span class="mut">none stated</span>'}
function list(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<div class="mut">None</div>'}

/* ---------- hero (summary) ---------- */
async function hero(){
  try{var s=await api('/v1/opp/summary');var n=s.recommended_next_action;
  $('hero').innerHTML='<div class="card"><h2>Your opportunity search</h2><div class="row">'+
    '<span class="pill">'+'<b data-n="'+s.strong_to_review+'">0</b>'+' strong to review</span><span class="pill warn">'+'<b data-n="'+s.deadlines_this_week+'">0</b>'+' deadline(s) this week</span>'+
    '<span class="pill">'+'<b data-n="'+s.applications_waiting_for_you+'">0</b>'+' application(s) waiting for you</span><span class="pill">'+'<b data-n="'+s.professors_with_research_match+'">0</b>'+' professor match(es)</span>'+
    '<span class="pill">'+'<b data-n="'+s.drafts_awaiting_approval+'">0</b>'+' draft(s) to approve</span><span class="pill">'+'<b data-n="'+s.followups_due+'">0</b>'+' follow-up(s) due</span>'+(s.programs_live?'<span class="pill good"><b data-n="'+s.programs_live+'">0</b> program(s) open or active</span>':'')+(s.programs_to_verify?'<span class="pill warn"><b data-n="'+s.programs_to_verify+'">0</b> program(s) to verify</span>':'')+'</div>'+
    (n?'<p style="margin:10px 0 0"><b>Next:</b> '+esc(n.text)+'</p>':'<p class="mut" style="margin:10px 0 0">Nothing urgent. Add an opportunity to get started.</p>')+
    '<div class="row" style="margin-top:8px"><button class="b alt" id="bprof">Edit my profile</button></div></div>';
  $('bprof').onclick=profileModal;countUp($('hero'))}catch(e){$('hero').innerHTML=''}}

/* ---------- profile ---------- */
async function profileModal(){
  var v=await api('/v1/opp/profile'),p=v.profile;
  function f(k,l,ph){return '<label>'+l+'</label><input id="pf_'+k+'" value="'+esc(Array.isArray(p[k])?p[k].join(', '):(p[k]==null?'':p[k]))+'" placeholder="'+(ph||'')+'">'}
  modal('<h2>Opportunity profile</h2><p class="mut">Matching only uses what you confirm here. OPAI does not guess eligibility details like work authorization.</p>'+
    (v.is_confirmed?'<div class="pill good">Confirmed</div>':'<div class="note">Not confirmed yet. Matches are provisional until you confirm.</div>')+
    '<div class="grid">'+f('degree','Degree','B.Tech')+f('year','Year of study (1-4)','2')+f('branch','Branch')+f('college','College')+f('graduation_date','Graduation (YYYY-MM)','2029-05')+f('cgpa','CGPA')+
    f('skills','Skills (comma separated)')+f('role_types','Roles (internship, research, part-time)')+f('locations','Locations')+f('work_modes','Work modes (remote, hybrid, onsite)')+
    f('available_from','Available from','2026-12-01')+f('available_to','Available to')+f('resume_url','Resume link')+f('portfolio_url','Portfolio link')+f('github_url','GitHub link')+'</div>'+
    f('eligibility_notes','Eligibility limits (anything the posting might ask)')+f('communication_style','Preferred communication style')+
    '<div class="row" style="margin-top:12px"><button class="b" id="pfsave">Save & confirm</button><button class="b alt" id="pfx">Cancel</button></div>');
  $('pfx').onclick=closeModal;
  $('pfsave').onclick=async function(){
    var body={confirm:true},num={year:1,cgpa:1},arr={skills:1,role_types:1,locations:1,work_modes:1};
    ['degree','year','branch','college','graduation_date','cgpa','skills','role_types','locations','work_modes','available_from','available_to','resume_url','portfolio_url','github_url','eligibility_notes','communication_style'].forEach(function(k){
      var x=$('pf_'+k).value.trim();if(!x)return;body[k]=arr[k]?x.split(',').map(function(s){return s.trim()}).filter(Boolean):(num[k]?Number(x):x)});
    try{await api('/v1/opp/profile',{method:'PUT',body:body});closeModal();toast('Profile confirmed');render()}catch(e){toast(e.message)}}}

/* ---------- brief card ---------- */
function briefCard(o){
  var b=o.brief||o;var full=!!b.signals;var id=o.id||b.opportunity_id;
  var h='<div class="card"><div class="row sp"><h3>'+esc(o.title)+' <span class="mut">· '+esc(o.organization)+'</span></h3><span class="pill '+esc(b.match)+'">Match: '+esc(b.match)+'</span></div>'+
    '<div class="row mut" style="margin-top:4px"><span>Deadline: '+fmt(o.deadline||b.deadline)+'</span>'+(b.days_left!=null?'<span>('+b.days_left+' days)</span>':'')+'<span>Prep ~'+b.estimated_prep_minutes+' min</span></div>'+
    '<div class="meter" title="Match strength"><i style="--w:'+(METER[b.match]||20)+'%"></i></div><div style="margin-top:6px"><b>Eligibility:</b> '+esc(b.eligibility.summary)+'</div>';
  if(full){h+='<div class="sig"><b>Verified facts</b>'+list(b.signals.verified_facts.map(function(x){return x.field+': '+x.value+' ('+x.basis+')'}))+'</div>'+
    '<div class="sig"><b>Profile match</b>'+list(b.signals.profile_match)+'</div><div class="sig"><b>Gaps (not shown in your profile)</b>'+list(b.match_detail.gaps)+'</div>'+
    '<div class="sig"><b>Unknown, needs your check</b>'+list(b.signals.unknown)+'</div><div class="sig"><b>AI suggestion (not a fact)</b>'+list(b.signals.ai_suggestions)+'</div>'}
  h+='<p style="margin:8px 0"><b>Next step:</b> '+esc(b.recommended_next_step)+'</p><div class="row">'+
    (o.source_url?'<a class="b alt" target="_blank" rel="noopener noreferrer" href="'+esc(o.source_url)+'">Open source</a>':'')+
    '<button class="b" data-a="track" data-id="'+esc(id)+'">Track opportunity</button>'+(full?'':'<button class="b alt" data-a="brief" data-id="'+esc(id)+'">Full brief</button>')+
    '<button class="b alt" data-a="verified" data-id="'+esc(id)+'">I re-checked the source</button><button class="b dng" data-a="dismiss" data-id="'+esc(id)+'">Not interested</button></div></div>';
  return h}

async function oppAction(a,id){
  try{
    if(a==='track'){await post('/v1/opp/opportunities/'+id+'/track');toast('Tracking. See Applications.');location.hash='#apps';tab='apps';render();return}
    if(a==='dismiss'){await post('/v1/opp/opportunities/'+id+'/dismiss');toast('Dismissed')}
    if(a==='verified'){await post('/v1/opp/opportunities/'+id+'/verified');toast('Marked as re-checked today')}
    if(a==='brief'){var b=await api('/v1/opp/opportunities/'+id+'/brief');modal(briefCard(Object.assign({id:id,title:b.title,organization:b.organization,deadline:b.deadline,source_url:b.source.url},{brief:b}))+'<button class="b alt" id="mx">Close</button>');$('mx').onclick=closeModal;return}
    render()}catch(e){toast(e.message)}}

var pgFilter='';
var PGCLS={'Open':'good','Active':'good','Opens soon':'warn','Upcoming':'warn','Verify current cycle':'warn','Not announced':'','Closed':'bad','Ended':'bad'};
function pgCard(p){var c=p.cycle,src=c.source||{};
  var dates=[c.applications_open?'Opens '+c.applications_open:'',c.deadline?'Deadline '+c.deadline:'',c.event_start?'Runs '+c.event_start+(c.event_end?' to '+c.event_end:''):''].filter(Boolean).join(' · ');
  return '<div class="card"><div class="row sp"><b>'+esc(p.name)+' \u2014 '+esc(c.label)+'</b><span class="pill '+(PGCLS[c.status]||'')+'">'+esc(c.status)+'</span></div>'+
   '<div class="mut">Type: '+esc(p.type_label)+(p.organizer?' · '+esc(p.organizer):'')+'</div>'+
   (dates&&c.confirmed?'<div style="margin-top:4px">'+esc(dates)+'</div>':'')+
   '<div style="margin-top:4px"><b>Eligibility:</b> '+esc(c.eligibility)+'</div>'+
   '<div style="margin-top:4px"><b>Next step:</b> '+esc(p.next_step)+'</div>'+
   (p.fit&&p.fit.level!=='unknown'?'<div class="mut" style="margin-top:4px">Why it may fit: '+esc(p.fit.why)+'</div>':'')+
   '<div class="mut" style="margin-top:4px">Official source: '+(p.official_url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(p.official_url)+'">'+esc(new URL(p.official_url).host)+'</a>':'none')+' · Last checked: '+esc(src.last_checked||'Not checked yet')+(c.needs_reverify?' <span class="pill warn">re-check</span>':'')+'</div>'+
   '<div class="mut">'+esc(c.status_why)+'</div>'+
   (p.next_cycle?'<div class="note" style="margin-top:6px"><b>Next announced cycle:</b> '+esc(p.next_cycle.status)+'. '+esc(p.next_cycle.next_step)+'</div>':'')+
   '<div class="row" style="margin-top:8px"><a class="b alt" target="_blank" rel="noopener noreferrer" href="'+esc(p.official_url||'#')+'">View official page</a>'+
   (c.status==='Closed'||c.status==='Ended'?(p.next_cycle?'<button class="b" data-pg="nextcycle" data-id="'+esc(p.id)+'">Add next cycle</button>':''):'<button class="b" data-pg="plan" data-id="'+esc(c.id)+'">Add to my plan</button>')+
   '<button class="b alt" data-pg="confirm" data-id="'+esc(c.id)+'">Confirm dates & rules</button><button class="b alt" data-pg="track" data-id="'+esc(c.id)+'" data-cur="'+esc(c.participation)+'">Track participation ('+esc(c.participation)+')</button><button class="b dng" data-pg="remove" data-id="'+esc(p.id)+'">Remove</button></div></div>'}
async function pgConfirmModal(cid){var r=await api('/v1/opp/programs');var p=r.items.find(function(x){return x.cycle.id===cid});if(!p)return;var c=p.cycle;
  modal('<h2>Confirm '+esc(p.name)+' \u2014 '+esc(c.label)+'</h2><div class="mut">Open the organizer\u2019s official page, then enter what it says. Dates are trusted only when you tick the box below and the page is on the organizer\u2019s own domain.</div>'+
   '<p><b>Paste text from the official page (optional)</b></p><textarea id="pc_text" style="min-height:90px" placeholder="Paste the dates / eligibility section"></textarea><div class="row" style="margin:6px 0"><button class="b alt" id="pc_read">Read it</button></div><div id="pc_flags"></div>'+
   '<p><b>Page you read this on</b></p><input id="pc_src" value="'+esc(src0(p))+'">'+
   '<div class="row" style="margin-top:6px"><label>Applications open<input type="date" id="pc_ao" value="'+esc(c.applications_open||'')+'"></label><label>Deadline<input type="date" id="pc_dl" value="'+esc(c.deadline||'')+'"></label></div>'+
   '<div class="row"><label>Event starts<input type="date" id="pc_es" value="'+esc(c.event_start||'')+'"></label><label>Event ends<input type="date" id="pc_ee" value="'+esc(c.event_end||'')+'"></label></div>'+
   '<p><b>Eligibility (as written on the page)</b></p><textarea id="pc_el" style="min-height:60px">'+esc(c.eligibility_known?c.eligibility:'')+'</textarea>'+
   '<div class="row"><input id="pc_rw" placeholder="Stipend / prize, only if officially stated" value="'+esc(c.reward||'')+'"><input id="pc_tc" placeholder="Time commitment" value="'+esc(c.time_commitment||'')+'"></div>'+
   '<label style="font-weight:500;display:block;margin:8px 0"><input type="checkbox" id="pc_ok" style="width:auto"> I read these details on the organizer\u2019s official page</label>'+
   '<label style="font-weight:500;display:block;margin:4px 0"><input type="checkbox" id="pc_na" style="width:auto"> The organizer has not announced this cycle yet</label>'+
   '<div class="row" style="margin-top:10px"><button class="b" id="pc_save">Save</button><button class="b alt" id="pc_x">Close</button></div>');
  $('pc_x').onclick=closeModal;
  $('pc_read').onclick=async function(){var t=$('pc_text').value;if(t.length<10){toast('Paste some text first.');return}var q=await post('/v1/opp/programs/parse',{text:t}),f=q.fields;

    $('em_out').innerHTML=r.candidates.length?r.candidates.map(function(c,i){return '<div class="card"><b>'+esc(c.title||'(title unclear)')+'</b> <span class="mut">'+esc(c.company||'')+'</span><div class="row" style="margin-top:6px"><a class="b alt" target="_blank" rel="noopener noreferrer" href="'+esc(c.source_url)+'">Open on LinkedIn</a><button class="b" data-ei="'+i+'">Track this</button></div></div>'}).join(''):'<div class="note">No job links found in that text.</div>';
    $('em_out').querySelectorAll('[data-ei]').forEach(function(b){b.onclick=async function(){var c=r.candidates[+b.dataset.ei];
      try{await post('/v1/opp/intake/confirm',{title:c.title||'Untitled role',company:c.company||'Unknown',source_url:c.source_url,source_type:'email_alert',location:c.location||null,extracted_fields:['title','company'],allow_duplicate:false});b.textContent='Saved';b.disabled=true}catch(err){toast(err.message)}}})}catch(err){toast(err.message)}}}

async function appModal(id){
  var a=await api('/v1/opp/applications/'+id);
  var opts=['Saved','Reviewing','Preparing','Ready to submit','Applied','Assessment','Interview','Offer','Rejected','Withdrawn'].map(function(s){return '<option'+(s===a.stage?' selected':'')+'>'+s+'</option>'}).join('');
  modal('<h2>'+esc(a.role)+' <span class="mut">· '+esc(a.company)+'</span></h2><div class="row"><span class="pill">'+esc(a.stage)+'</span>'+(a.link?'<a class="b alt" target="_blank" rel="noopener noreferrer" href="'+esc(a.link)+'">Open original posting</a>':'')+'</div>'+
    '<h3 style="margin-top:12px">Checklist</h3>'+a.checklist.map(function(c){return '<div>'+(c.done?'\u2611':'\u2610')+' '+esc(c.item)+'</div>'}).join('')+
    '<label>Move to stage</label><select id="as_st">'+opts+'</select><label style="font-weight:500"><input type="checkbox" id="as_sub" style="width:auto"> I submitted this on the original site myself (required for Applied)</label>'+
    '<label>Note</label><input id="as_note"><label>Recruiter / referral email (for follow-ups)</label><input id="as_ref" value="'+esc(a.contact_ref||'')+'">'+
    '<div class="row" style="margin-top:10px"><button class="b" id="as_go">Update</button><button class="b alt" id="as_x">Close</button></div>'+
    '<h3 style="margin-top:14px">History</h3>'+(a.history.map(function(h){return '<div class="mut">'+esc((h.at||'').slice(0,10))+' · '+esc(h.from||'')+(h.to?' → '+esc(h.to):'')+' '+esc(h.note||'')+'</div>'}).join('')));
  $('as_x').onclick=closeModal;
  $('as_go').onclick=async function(){try{
    if($('as_ref').value.trim()!==(a.contact_ref||''))await api('/v1/opp/applications/'+id+'/prep',{method:'PUT',body:{contact_ref:$('as_ref').value.trim()}});
    if($('as_st').value!==a.stage)await post('/v1/opp/applications/'+id+'/stage',{to:$('as_st').value,note:$('as_note').value||null,user_confirms_submitted:$('as_sub').checked});
    closeModal();render()}catch(err){toast(err.message)}}}

var gcfg=null;
async function gmailCfg(){if(gcfg)return gcfg;try{gcfg=await api('/v1/opp/config')}catch(e){gcfg={gmail_send_enabled:false}}return gcfg}
function gmailToken(cfg){return new Promise(function(res,rej){
  function go(){try{google.accounts.oauth2.initTokenClient({client_id:cfg.google_client_id,scope:cfg.gmail_scope,callback:function(r){r&&r.access_token?res(r.access_token):rej(new Error('Gmail permission was not granted.'))},error_callback:function(){rej(new Error('Gmail sign-in was cancelled.'))}}).requestAccessToken()}catch(e){rej(new Error('Could not start Google sign-in.'))}}
  if(window.google&&google.accounts&&google.accounts.oauth2)return go();
  var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=go;sc.onerror=function(){rej(new Error('Could not load Google sign-in.'))};document.head.appendChild(sc)})}
async function sendViaGmail(id){var cfg=await gmailCfg();if(!cfg.gmail_send_enabled){toast('Gmail sending is not set up. Use Open in Gmail instead.');return}
  try{var tok=await gmailToken(cfg);var r=await api('/v1/opp/outbox/'+id+'/send',{method:'POST',body:{},headers:{'X-Gmail-Token':tok}});toast('Sent through Gmail. Follow-up scheduled for '+r.follow_up_date+'.');closeModal();render()}catch(err){toast(err.message)}}
async function reviewModal(id){
  var r=await api('/v1/opp/outbox/'+id+'/review');var ri=r.recipient;
  modal('<h2>Review before approving</h2><div class="mut">Approval covers exactly this message. If anything changes, you will need to review again.</div>'+
    '<p><b>To:</b> '+esc(ri.to||'(none)')+' <span class="pill '+(ri.verification==='unverified'?'warn':'good')+'">'+esc(ri.verification.replace(/_/g,' '))+'</span></p>'+(ri.source?'<div class="mut">Source: <a target="_blank" rel="noopener noreferrer" href="'+esc(ri.source)+'">'+esc(ri.source)+'</a> · checked '+esc(ri.source_checked_on||'?')+'</div>':'')+
    '<p><b>Sending account:</b> '+esc(r.sending_account)+'</p><p><b>Subject</b></p><input id="rv_sub" value="'+esc(r.subject||'')+'"><p><b>Body</b></p><textarea id="rv_body" style="min-height:200px">'+esc(r.body||'')+'</textarea>'+
    (r.attachments.length?'<p><b>Attachments:</b> '+esc(r.attachments.join(', '))+'</p>':'')+r.warnings.map(function(w){return '<div class="note">'+esc(w)+'</div>'}).join('')+
    '<div class="mut">Follow-up scheduled: '+esc(r.follow_up_if_sent)+'</div>'+(ri.verification==='unverified'?'<label style="font-weight:500"><input type="checkbox" id="rv_conf" style="width:auto"> I checked this email address</label>':'')+
    '<div class="row" style="margin-top:10px"><button class="b alt" id="rv_save">Save edits</button><button class="b" id="rv_ok">Approve this exact message</button><button class="b alt" id="rv_x">Close</button></div>');
  $('rv_x').onclick=closeModal;
  $('rv_save').onclick=async function(){try{await api('/v1/opp/outbox/'+id,{method:'PATCH',body:{subject:$('rv_sub').value,body:$('rv_body').value}});toast('Saved. Review again to approve.');reviewModal(id)}catch(err){toast(err.message)}};
  $('rv_ok').onclick=async function(){
    if($('rv_sub').value!==(r.subject||'')||$('rv_body').value!==(r.body||'')){toast('You edited the text. Press Save edits, then review again.');return}
    try{var a=await post('/v1/opp/outbox/'+id+'/approve',{reviewed_hash:r.payload_hash,confirm_recipient:!!($('rv_conf')&&$('rv_conf').checked)});
      var gc=await gmailCfg();modal('<h2>Approved</h2><p>'+esc(a.message)+'</p><div class="mut">Send with Gmail uses a send-only permission. OPAI cannot read your inbox.</div><div class="row">'+(gc.gmail_send_enabled?'<button class="b" id="gs">Send with Gmail</button>':'')+'<a class="b'+(gc.gmail_send_enabled?' alt':'')+'" target="_blank" rel="noopener noreferrer" href="'+esc(a.compose_url)+'">Open in Gmail</a><button class="b alt" id="mx">Close</button></div>');if($('gs'))$('gs').onclick=function(){sendViaGmail(id)};$('mx').onclick=function(){closeModal();render()}}catch(err){toast(err.message)}}}

render();
})();
</script>
