<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internships · OPAI</title>
<meta name="theme-color" content="#F6F4EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opai-shared.css">
<style>
:root{--bg:#F6F4EE;--ink:#16181A;--mut:#4A4F52;--pri:#17504A;--coral:#E8705A;--font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#F6F4EE}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/24px var(--font);min-height:100vh}
.cs{min-height:calc(100vh - 56px);display:grid;place-items:center;text-align:center;padding:24px 20px 120px}
.cs h1{margin:0;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--pri);font-size:clamp(48px,13vw,140px)}
.cs .tag{display:inline-block;margin-bottom:18px;padding:6px 14px;border-radius:999px;background:rgba(232,112,90,.14);color:var(--coral);font:600 13px/16px var(--font);letter-spacing:.08em;text-transform:uppercase}
.cs p{margin:18px auto 0;max-width:34ch;color:var(--mut);font-size:clamp(15px,2.4vw,18px)}
</style>
</head>
<body>
<main class="cs" id="main">
  <div>
    <span class="tag">Internships</span>
    <h1>Coming Soon</h1>
    <p>Internship tracking is being rebuilt. Ask KARNA in the meantime.</p>
  </div>
</main>
<script src="opai-shell.js" defer></script>
<script src="guide.js" defer></script>
<script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
</body>
</html>
