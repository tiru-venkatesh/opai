<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications · OPAI</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--s1:#1c1b1d;--s2:#201f22;--s3:#2a2a2c;--line:#444748;--tx:#e5e1e4;--mut:#c4c7c8;--pri:#fff;--font:'Geist',system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/22px var(--font)}
header{position:sticky;top:0;z-index:5;background:rgba(14,14,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(68,71,72,.4)}
.bar{max-width:1200px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:20px}
.brand{font-weight:600;color:var(--pri);letter-spacing:-.01em}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap}
nav a:hover{background:var(--s1);color:var(--tx)}
nav a[aria-current=page]{background:var(--s3);color:var(--pri);font-weight:500}
a:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:30px;line-height:36px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px;color:var(--pri)}
.sub{color:var(--mut);margin:0 0 28px}
h2{font-size:16px;font-weight:500;color:var(--pri);margin:36px 0 12px}
h2 small{color:var(--mut);font-weight:400;margin-left:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:start}
.col{background:var(--s1);border-radius:10px;padding:14px}
.col h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--mut);display:flex;justify-content:space-between}
.card{background:var(--s2);border-radius:8px;padding:12px;margin-bottom:10px}
.card:last-child{margin-bottom:0}
.co{color:var(--pri);font-weight:500}
.role,.meta{color:var(--mut);font-size:13px}
.meta{margin-top:6px}
.late{color:#ffb4ab}
select{margin-top:10px;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
.empty{background:var(--s1);border-radius:10px;padding:18px;color:var(--mut)}
.empty b{color:var(--pri);font-weight:500}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.opps .card{background:var(--s1);margin:0}
.note{margin-top:40px;color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:background .15s}.card:hover{background:var(--s3)}}
</style>
</head>
<body>
<header><div class="bar">
<span class="brand">OPAI</span>
<nav aria-label="Main">
<a href="super-chat.html" id="n-chat">Super Chat</a>
<a href="app.html">Overview</a>
<a href="app.html#/today">Today</a>
<a href="applications.html" aria-current="page">Applications</a>
<a href="app.html#/outreach">Outreach</a>
<a href="app.html#/projects">Projects</a>
<a href="app.html#/outbox">Outbox</a>
<a href="app.html#/agent">Agent</a>
</nav></div></header>
<main>
<h1>Applications</h1>
<p class="sub" id="sum"></p>
<div id="board"></div>
<h2>Open opportunities <small id="ocount"></small></h2>
<div id="opps"></div>
<p class="note" id="note"></p>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var STAGES=['Not started','Applied','Interview','Offer','Rejected'];
var WS=null,S={};
function load(){
  var best=null,bt=-1;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k!=='opa_demo_v3'&&!/^opa_ws_/.test(k))continue;
    var o;try{o=JSON.parse(localStorage.getItem(k))}catch(e){continue}
    if(!o||typeof o!=='object')continue;
    var t=Date.parse(o.history&&o.history[0]&&o.history[0].at)||0;
    if(!best||t>bt){best={key:k,data:o};bt=t}}}catch(e){}
  WS=best;S=(best&&best.data)||{};
  ['applications','opportunities','history'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
}
function save(){try{if(WS)localStorage.setItem(WS.key,JSON.stringify(S))}catch(e){}}
function days(d){if(!d)return null;var t=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function due(d){var n=days(d);if(n==null)return{t:'No deadline',late:false};
  return n<0?{t:'Overdue',late:true}:n===0?{t:'Due today',late:true}:n===1?{t:'Due tomorrow',late:false}:{t:'Due in '+n+' days',late:false}}
function render(){
  var apps=S.applications,active=apps.filter(function(a){return a.status!=='Rejected'}).length;
  $('sum').textContent=apps.length?apps.length+' tracked, '+active+' still active.':'';
  if(!WS){
    $('board').innerHTML='<div class="empty"><b>No workspace found in this browser.</b><br>Open the main app on this site first and add an application. This page shows what it saves.</div>';
  }else if(!apps.length){
    $('board').innerHTML='<div class="empty"><b>No applications yet.</b><br>Add one in the main app and it will appear here.</div>';
  }else{
    $('board').innerHTML='<div class="cols">'+STAGES.map(function(st){
      var items=apps.filter(function(a){return a.status===st});
      return '<section class="col" aria-label="'+esc(st)+'"><h3><span>'+esc(st)+'</span><span>'+items.length+'</span></h3>'+
      items.map(function(a){var d=due(a.deadline);
        return '<div class="card"><div class="co">'+esc(a.company)+'</div><div class="role">'+esc(a.role)+'</div><div class="meta'+(d.late?' late':'')+'">'+esc(d.t)+'</div>'+
        '<select data-id="'+esc(a.id)+'" aria-label="Stage for '+esc(a.company)+'">'+STAGES.map(function(o){return '<option'+(o===st?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></div>'}).join('')+'</section>'}).join('')+'</div>';
  }
  var opps=S.opportunities.filter(function(o){return o.status==='New'});
  $('ocount').textContent=opps.length?opps.length+' to review':'';
  $('opps').innerHTML=opps.length?'<div class="opps">'+opps.map(function(o){var d=due(o.deadline);
    return '<div class="card"><div class="co">'+esc(o.title)+'</div><div class="role">'+esc(o.org)+'</div><div class="meta'+(d.late?' late':'')+'">'+esc(d.t.replace('Due','Closes'))+'</div></div>'}).join('')+'</div>'
    :'<div class="empty">No open opportunities. New matches will show up here.</div>';
  $('note').textContent=WS?'Changes here save to the same workspace the main app uses, in this browser.':'';
}
document.addEventListener('change',function(e){
  var el=e.target;if(!el.matches||!el.matches('select[data-id]'))return;
  var a=S.applications.find(function(x){return String(x.id)===el.getAttribute('data-id')});
  if(!a||a.status===el.value)return;
  var from=a.status;a.status=el.value;
  S.history.unshift({id:'h'+Date.now(),at:new Date().toISOString(),text:a.company+' moved from '+from+' to '+a.status});
  save();render();
});
window.addEventListener('storage',function(e){if(WS&&e.key===WS.key){load();render()}});
var sc=$('n-chat');
if(sc&&location.protocol!=='file:'&&!/\.html$/.test(location.pathname))sc.setAttribute('href','/super-chat');
load();render();
})();
</script>
</body>
</html>
