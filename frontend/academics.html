<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academics · OPAI</title>
<meta name="theme-color" content="#F6F4EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opai-shared.css"><link rel="stylesheet" href="opai-theme.css"><script src="opai-ux.js"></script>
<style>
:root{--bg:#F6F4EE;--ink:#16181A;--mut:#4A4F52;--pri:#17504A;--coral:#E8705A;--card:#FBFAF6;--hair:#E3DFD3;--well:#EDE9DF;--font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/22px var(--font);min-height:100vh}
main{max-width:1180px;margin:0 auto;padding:84px 16px 120px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.03em;color:var(--pri)}
.sub{color:var(--mut);margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:14px}
.panel h2{margin:0 0 10px;font:600 12px/16px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.course{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.course:hover,.course[aria-pressed=true]{border-color:var(--pri);background:#E1EEEA}
.course b{display:block}.course small{color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font:500 12px/18px var(--mono);background:var(--well);color:var(--mut)}
.pill.soon{background:#FCE4DC;color:#C2452F}.pill.ok{background:#E1EEEA;color:var(--pri)}
#thread{display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:92%;padding:12px 14px;border-radius:14px;border:1px solid var(--hair);background:#fff;word-wrap:break-word}
.msg.k{align-self:flex-start}.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-color:var(--pri)}
.msg.err{background:#FCE4DC;border-color:#E8705A}
.who{font:600 11px/14px var(--mono);letter-spacing:.08em;color:var(--coral);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.chip,label.chip{display:inline-block;border:1px solid var(--pri);color:var(--pri);background:#fff;border-radius:999px;padding:6px 14px;font:500 14px/20px var(--font);cursor:pointer}
button.chip:hover{background:var(--pri);color:#fff}
button.go{background:var(--coral);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:600 14px/20px var(--font);cursor:pointer}
button.go:disabled{opacity:.5;cursor:default}
.unit{border-top:1px solid var(--hair);padding:8px 0}.unit:first-of-type{border-top:0}
.unit summary{cursor:pointer;font-weight:600}.unit ul{margin:6px 0 0 18px;padding:0;color:var(--mut)}
.rate{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--hair)}
.rate span{flex:1}.dots{display:flex;gap:4px}
.dots button{width:32px;height:32px;border-radius:8px;border:1px solid var(--hair);background:#fff;cursor:pointer;font:500 13px var(--font)}
.dots button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.composer{margin-top:14px;display:grid;gap:10px}
.composer input[type=text],.composer textarea,.composer input[type=date],.composer input[type=number]{width:100%;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
.composer textarea{min-height:92px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drop{border:2px dashed var(--hair);border-radius:12px;padding:14px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--pri);background:#E1EEEA}
.note{color:var(--mut);font-size:13px}
.topic{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--hair)}
.sr{position:absolute;left:-9999px}

/* ---------- motion (no new content; all disabled under prefers-reduced-motion) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(232,112,90,.55)}to{box-shadow:0 0 0 16px rgba(232,112,90,0)}}
@keyframes march{to{background-position:24px 0,-24px 100%,0 -24px,100% 24px}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wrap-mic{position:relative}.wrap-mic textarea{padding-right:56px}
.mic{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--pri);background:#fff;color:var(--pri);display:grid;place-items:center;cursor:pointer;transition:transform .18s,background .18s,color .18s}
.mic:hover{transform:scale(1.1);background:var(--pri);color:#fff}.mic:active{transform:scale(.92)}
.mic.rec{background:var(--coral);border-color:var(--coral);color:#fff;animation:ring 1.1s ease-out infinite}
.mic svg{display:block}
.typing{display:inline-flex;gap:5px;padding:2px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--pri);animation:bob 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.skel{height:64px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,var(--well) 0,#f7f4ec 50%,var(--well) 100%);background-size:400px 100%;animation:shimmer 1.2s linear infinite}
button.go{position:relative;overflow:hidden}
button.go.working::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep 1s linear infinite}
@media (prefers-reduced-motion:no-preference){
  aside h1{animation:rise .5s both}.sub{animation:rise .5s .08s both}
  aside .panel{animation:rise .55s .14s both}section.panel{animation:rise .55s .22s both}
  .msg.k{animation:slideL .38s cubic-bezier(.2,.8,.2,1) both}.msg.u{animation:slideR .38s cubic-bezier(.2,.8,.2,1) both}
  .course{animation:rise .45s both;animation-delay:calc(var(--i,0)*70ms + 120ms);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
  .course:hover{transform:translateY(-3px);box-shadow:0 10px 22px -14px rgba(23,80,74,.55)}.course:active{transform:scale(.98)}
  .unit{animation:rise .4s both;animation-delay:calc(var(--i,0)*55ms)}.unit summary{transition:color .2s,padding-left .2s}.unit summary:hover{color:var(--pri);padding-left:4px}
  .unit[open] ul,.unit[open] .topic{animation:rise .3s both}
  .topic,.rate{animation:rise .35s both;animation-delay:calc(var(--i,0)*35ms)}
  .pill{transition:transform .2s}.course:hover .pill{transform:scale(1.06)}.pill.soon{animation:drift 2.4s ease-in-out infinite}
  button.chip,label.chip{transition:transform .18s,background .18s,color .18s,box-shadow .18s}
  button.chip:hover,label.chip:hover{transform:translateY(-2px);box-shadow:0 8px 16px -10px rgba(23,80,74,.6)}
  button.chip:active,label.chip:active{transform:scale(.95)}
  .chips .chip{animation:rise .4s both;animation-delay:calc(var(--i,0)*70ms)}
  button.go{transition:transform .18s,box-shadow .18s,filter .18s}button.go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px -10px rgba(232,112,90,.9)}button.go:active:not(:disabled){transform:scale(.96)}
  .dots button{transition:transform .15s,background .15s,color .15s}.dots button:hover{transform:translateY(-2px)}.dots button.on{animation:pop .3s}
  .composer input,.composer textarea{transition:border-color .2s,box-shadow .2s,transform .2s}.composer input:focus,.composer textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(23,80,74,.12)}
  .drop{transition:background .25s,transform .25s;background-image:linear-gradient(90deg,var(--hair) 50%,transparent 0),linear-gradient(90deg,var(--hair) 50%,transparent 0),linear-gradient(0deg,var(--hair) 50%,transparent 0),linear-gradient(0deg,var(--hair) 50%,transparent 0);background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-size:12px 2px,12px 2px,2px 12px,2px 12px;background-position:0 0,0 100%,0 0,100% 0;border:0;animation:march 1.6s linear infinite}
  .drop.over{transform:scale(1.02);background-color:#E1EEEA}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="main">
  <aside>
    <h1>Academics</h1>
    <p class="sub">Give KARNA your syllabus. It builds the course map and asks what it still needs.</p>
    <div class="panel"><h2>Your courses</h2><div id="courses"><p class="note">Loading…</p></div></div>
  </aside>
  <section class="panel" aria-live="polite">
    <h2>KARNA intake</h2>
    <div id="thread"></div>
    <div id="ask"></div>
    <div class="composer" id="intake">
      <input type="text" id="cname" placeholder="Course name (optional, e.g. Data Structures)" aria-label="Course name">
      <div class="drop" id="drop">
        <label class="chip" for="file">Upload syllabus (PDF, DOCX, TXT, MD)</label>
        <input class="sr" type="file" id="file" accept=".pdf,.docx,.txt,.md,.markdown" multiple>
        <div class="note" style="margin-top:8px">or drop files here. Scanned PDFs and photos need text first; paste the topics below instead.</div>
      </div>
      <div class="wrap-mic"><textarea id="paste" placeholder="…or paste the syllabus text here (units and topics)" aria-label="Paste syllabus text"></textarea><button type="button" class="mic" id="mic" hidden aria-pressed="false" title="Speak" aria-label="Speak the syllabus or answer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
      <div class="row"><button class="go" id="build">Build from pasted text</button><span class="note" id="status"></span></div>
    </div>
  </section>
</main>
<script src="opai-shell.js" defer></script>
<script src="guide.js" defer></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const base = () => (localStorage.getItem('opa_api_base') || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8000' : 'https://opa-52ug.onrender.com')).replace(/\/+$/, '');
  let uid = null, current = null, answers = null;

  async function api(path, opts = {}) {
    const isForm = opts.body instanceof FormData;
    const res = await fetch(base() + path, { headers: opts.body && !isForm ? { 'Content-Type': 'application/json' } : {}, ...opts });
    if (!res.ok) {
      let d = ''; try { d = (await res.json()).detail || ''; } catch (e) {}
      if (Array.isArray(d)) d = d.map((x) => x.msg).join('; ');
      const err = new Error(d || (res.status + ' ' + res.statusText)); err.status = res.status; throw err;
    }
    const t = await res.text(); return t ? JSON.parse(t) : null;
  }
  async function ensureUser() {
    if (uid) return uid;
    const em = localStorage.getItem('opai_sc_email');
    if (!em) { location.replace('login.html'); throw new Error('Please sign in'); }
    uid = (await api('/v1/auth/dev-login?email=' + encodeURIComponent(em), { method: 'POST' })).user_id; return uid;
  }

  const thread = $('thread');
  function say(who, html, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + (who === 'u' ? 'u' : 'k') + (cls ? ' ' + cls : '');
    d.innerHTML = (who === 'k' ? '<div class="who">KARNA</div>' : '') + html;
    thread.appendChild(d); d.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return d;
  }
  let typingEl = null;
  const busy = (b, msg) => {
    $('build').disabled = b; $('file').disabled = b; $('build').classList.toggle('working', b); $('status').textContent = msg || '';
    if (b && !typingEl) { typingEl = say('k', '<span class="typing" aria-label="KARNA is working"><i></i><i></i><i></i></span>'); }
    if (!b && typingEl) { typingEl.remove(); typingEl = null; }
  };

  /* ---------- courses sidebar + course map ---------- */
  const daysTo = (iso) => Math.ceil((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  async function loadCourses() {
    const box = $('courses');
    if (!box.querySelector('.course')) box.innerHTML = '<div class="skel"></div><div class="skel" style="opacity:.6"></div>';
    try {
      const u = await ensureUser();
      const [cs, ex] = await Promise.all([api('/v1/courses?user_id=' + u), api('/v1/exams?user_id=' + u)]);
      if (!cs.length) { box.innerHTML = '<p class="note">No courses yet. Upload a syllabus to start.</p>'; return; }
      box.innerHTML = cs.map((c, i) => {
        const e = ex.filter((x) => x.course_id === c.id && x.exam_date).sort((a, b) => a.exam_date.localeCompare(b.exam_date))[0];
        const d = e ? daysTo(e.exam_date) : null;
        const tag = e ? '<span class="pill ' + (d >= 0 && d <= 14 ? 'soon' : 'ok') + '">' + esc(e.exam_type) + ' · ' + (d < 0 ? 'done' : d + 'd') + '</span>' : '<span class="pill">no exam date</span>';
        return '<button class="course" style="--i:' + i + '" data-id="' + esc(c.id) + '" aria-pressed="false"><b>' + esc(c.name) + '</b><small>' + esc(c.code || '') + '</small> ' + tag + '</button>';
      }).join('');
    } catch (e) { box.innerHTML = '<p class="note">Could not load courses (' + esc(e.message) + ').</p>'; }
  }
  $('courses').addEventListener('click', async (ev) => {
    const b = ev.target.closest('.course'); if (!b) return;
    document.querySelectorAll('.course').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    try {
      const ts = await api('/v1/courses/' + encodeURIComponent(b.dataset.id) + '/topics');
      const byUnit = {}; ts.forEach((t) => (byUnit[t.unit || 'Topics'] = byUnit[t.unit || 'Topics'] || []).push(t));
      say('k', '<b>' + esc(b.querySelector('b').textContent) + '</b> · ' + ts.length + ' topics' + Object.entries(byUnit).map(([u, l], ui) =>
        '<details class="unit" style="--i:' + ui + '" open><summary>' + esc(u) + '</summary>' + l.map((t) => '<div class="topic"><span>' + esc(t.name) + '</span><span class="pill">conf ' + t.confidence + '/5 · ' + t.estimated_minutes + 'm</span></div>').join('') + '</details>').join(''));
    } catch (e) { say('k', 'Could not load topics: ' + esc(e.message), 'err'); }
  });

  /* ---------- build from file / text ---------- */
  async function afterBuild(r) {
    if (!r.ok) { say('k', esc(r.filename ? r.filename + ': ' : '') + esc(r.error || 'Could not read this file.'), 'err'); return; }
    if (r.booklet) {
      say('k', 'This file has <b>' + r.choose.length + ' courses</b> (a full university booklet). Which one do you want to build? Tap it, or type its name in the course name box.' +
        '<div class="chips" style="margin-top:8px;max-height:260px;overflow:auto">' + r.choose.map((c, i) => '<button type="button" class="chip" style="--i:' + Math.min(i, 12) + '" data-pick="' + esc(c.title) + '" title="' + esc(c.sem) + '">' + esc(c.title) + '</button>').join('') + '</div>');
      return;
    }
    current = r; answers = { exams: [], unit_confidence: {} };
    const n = r.units.reduce((a, u) => a + u.topics.length, 0);
    say('k', 'I read <b>' + esc(r.course) + '</b>' + (r.code ? ' (' + esc(r.code) + ')' : '') + ' and found <b>' + r.units.length + ' units</b> and <b>' + n + ' topics</b>. Please check them:' +
      r.units.map((u, ui) => '<details class="unit" style="--i:' + ui + '"><summary>' + esc(u.unit) + ' · ' + u.topics.length + '</summary><ul>' + u.topics.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul></details>').join(''));
    r.questions.filter((q) => /couldn't find|only one unit|no topic list/.test(q)).forEach((q) => say('k', esc(q)));
    if (!r.units.length) return;
    loadCourses(); askConfidence();
  }
  let lastFiles = [], lastText = '';
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-pick]'); if (!b) return;
    $('cname').value = b.dataset.pick;
    if (lastFiles.length) submitFiles(lastFiles); else if (lastText) { $('paste').value = lastText; $('build').click(); }
  });
  async function submitFiles(files) {
    if (!files.length) return;
    busy(true, 'Reading and indexing…');
    try {
      lastFiles = [...files];
      const u = await ensureUser(), fd = new FormData();
      fd.append('user_id', u); fd.append('course_name', $('cname').value.trim());
      [...files].forEach((f) => fd.append('files', f));
      say('u', esc([...files].map((f) => f.name).join(', ')));
      const r = await api('/v1/academics/syllabus', { method: 'POST', body: fd });
      for (const x of r.results) await afterBuild(x);
    } catch (e) { say('k', 'Upload failed: ' + esc(e.message), 'err'); }
    busy(false); $('file').value = '';
  }
  $('file').addEventListener('change', (e) => submitFiles(e.target.files));
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => submitFiles(e.dataTransfer.files));
  $('build').addEventListener('click', async () => {
    const text = $('paste').value.trim();
    if (text.length < 20) { say('k', 'Paste the syllabus first: units and their topics.', 'err'); return; }
    busy(true, 'Reading and indexing…');
    try {
      const u = await ensureUser();
      lastText = text; lastFiles = [];
      say('u', esc(text.slice(0, 160)) + (text.length > 160 ? '…' : ''));
      const r = await api('/v1/academics/syllabus/text', { method: 'POST', body: JSON.stringify({ user_id: u, text, course_name: $('cname').value.trim() }) });
      $('paste').value = ''; await afterBuild({ ok: true, ...r });
    } catch (e) { say('k', 'Could not build: ' + esc(e.message), 'err'); }
    busy(false);
  });

  /* ---------- KARNA asks, user answers ---------- */
  const ask = $('ask');
  function askConfidence() {
    const units = current.units.map((u) => u.unit);
    units.forEach((u) => { answers.unit_confidence[u] = 0; });
    say('k', 'How confident are you in each unit right now? (1 = never studied, 5 = exam ready). I will start your plan from the weakest.');
    ask.innerHTML = '<div class="panel" style="margin-top:10px">' + units.map((u, i) =>
      '<div class="rate" style="--i:' + i + '"><span>' + esc(u) + '</span><div class="dots" data-u="' + i + '">' + [1, 2, 3, 4, 5].map((n) => '<button type="button" data-n="' + n + '" aria-label="' + esc(u) + ' confidence ' + n + '">' + n + '</button>').join('') + '</div></div>').join('') +
      '<div class="row" style="margin-top:10px"><button class="go" id="conf-next">Next: exam</button></div></div>';
    ask.querySelectorAll('.dots').forEach((d) => d.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      answers.unit_confidence[units[+d.dataset.u]] = +b.dataset.n;
      d.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    }));
    $('conf-next').onclick = () => {
      const missing = units.filter((u) => !answers.unit_confidence[u]);
      if (missing.length && !confirm(missing.length + ' unit(s) not rated. They will be treated as 1 (weakest). Continue?')) return;
      missing.forEach((u) => (answers.unit_confidence[u] = 1));
      say('u', 'Confidence saved for ' + units.length + ' units.'); askExam(true);
    };
  }
  function askExam(first) {
    say('k', first ? 'Which exam is this syllabus for?' : 'Which exam is next?');
    ask.innerHTML = '<div class="chips">' + ['Mid Sem', 'End Sem', 'Quiz / Internal'].map((t, i) => '<button class="chip" style="--i:' + i + '" data-t="' + t + '">' + t + '</button>').join('') +
      '<button class="chip" data-t="skip">Skip, no exam date yet</button></div>';
    ask.onclick = (e) => {
      const b = e.target.closest('button[data-t]'); if (!b) return;
      if (b.dataset.t === 'skip') { say('u', 'No exam date yet'); return finish(); }
      say('u', b.dataset.t); askDetails(b.dataset.t === 'Mid Sem' ? 'Mid Semester' : b.dataset.t === 'End Sem' ? 'End Semester' : 'Quiz');
    };
  }
  function askDetails(type) {
    say('k', 'When is the ' + esc(type) + ' exam? Time, venue and marks are optional.');
    ask.onclick = null;
    ask.innerHTML = '<div class="composer"><input type="date" id="ed" aria-label="Exam date"><div class="row"><input type="text" id="et" placeholder="Time (10:00)" style="flex:1" aria-label="Exam time"><input type="text" id="ev" placeholder="Venue" style="flex:1" aria-label="Venue"><input type="number" id="ew" placeholder="Marks %" min="1" max="100" style="width:110px" aria-label="Weightage percent"></div><div class="row"><button class="go" id="ed-ok">Save exam</button></div></div>';
    $('ed-ok').onclick = () => {
      const d = $('ed').value; if (!d) { $('ed').focus(); return; }
      const t = $('et').value.trim();
      answers.exams.push({ exam_type: type, exam_date: d, exam_time: t || null, venue: $('ev').value.trim() || null, weightage: +$('ew').value || null });
      say('u', esc(type) + ' · ' + esc(d) + (t ? ' ' + esc(t) : ''));
      say('k', 'Is there another exam for this course (for example the end sem after the mid sem)?');
      ask.innerHTML = '<div class="chips"><button class="chip" id="more">Yes, add another</button><button class="chip" id="done">No, that is all</button></div>';
      $('more').onclick = () => { say('u', 'Add another'); askExam(false); };
      $('done').onclick = () => { say('u', 'That is all'); finish(); };
    };
  }
  async function finish() {
    ask.innerHTML = ''; ask.onclick = null; busy(true, 'Saving…');
    try {
      const u = await ensureUser(); let ok = 0;
      const list = answers.exams.length ? answers.exams : [{ exam_date: null }];
      for (const ex of list) {
        await api('/v1/academics/syllabus/answers', { method: 'POST', body: JSON.stringify({ user_id: u, course_id: current.course_id, unit_confidence: answers.unit_confidence, ...ex }) });
        if (ex.exam_date) ok++;
      }
      say('k', 'Saved. ' + (ok ? ok + ' exam(s) added as <b>tentative</b>; confirm them once the timetable is final. ' : 'No exam date yet; add it later and I will build your deadline plan. ') + 'Your syllabus is indexed, so you can ask me about any topic in KARNA and I will answer from it with sources.');
      await loadCourses();
    } catch (e) { say('k', 'Could not save: ' + esc(e.message), 'err'); }
    busy(false);
  }

  /* ---------- mic: live transcription into the text box (Web Speech API; hidden if unsupported) ---------- */
  (function mic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition, btn = $('mic'), box = $('paste');
    if (!SR) return; btn.hidden = false;
    const VOICE = { en: 'en-IN', hi: 'hi-IN', te: 'te-IN' };
    let rec = null, base0 = '';
    const ui = (on) => { btn.classList.toggle('rec', on); btn.setAttribute('aria-pressed', String(on)); btn.title = on ? 'Stop listening' : 'Speak'; };
    btn.addEventListener('click', () => {
      if (rec) { try { rec.stop(); } catch (e) {} return; }
      rec = new SR();
      rec.lang = localStorage.getItem('opai_voice_lang') || VOICE[localStorage.getItem('opai_reply_lang')] || navigator.language || 'en-IN';
      rec.interimResults = true; rec.continuous = true;
      base0 = box.value ? box.value.replace(/\s*$/, ' ') : '';
      rec.onresult = (e) => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; box.value = base0 + t; box.scrollTop = box.scrollHeight; };
      rec.onerror = (e) => { $('status').textContent = (e.error === 'not-allowed' || e.error === 'service-not-allowed') ? 'Microphone is blocked. Allow it in your browser settings.' : e.error === 'no-speech' ? 'Did not catch anything. Try again.' : ''; };
      rec.onend = () => { rec = null; ui(false); box.focus(); };
      try { rec.start(); ui(true); $('status').textContent = ''; } catch (e) { rec = null; ui(false); }
    });
    $('build').addEventListener('click', () => { if (rec) { try { rec.stop(); } catch (e) {} } });
  })();

  say('k', 'Hi! Upload your syllabus (or paste the units and topics) and I will build your course map. Then I will ask a few quick questions: how confident you are, and when the exams are.');
  loadCourses();
})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
