<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coding · OPAI</title>
<meta name="theme-color" content="#EDE0D4">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opai-shared.css">
<link rel="stylesheet" href="opai-theme.css">
<link rel="stylesheet" href="opai-motion2.css">
<link rel="stylesheet" href="opai-mobile.css">
<script src="opai-session.js"></script><script src="opai-ux.js"></script>
<style>
:root{--font:'Geist',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;min-height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:14px/20px var(--font)}
.coding-top{flex:none;padding:12px 16px 0;border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--paper) 94%,transparent)}
.coding-head{max-width:1120px;margin:0 auto 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.coding-head h1{font-size:19px;line-height:24px;letter-spacing:-.025em;margin:0;font-weight:650}
.coding-head p{font-size:12px;line-height:17px;color:var(--ink-2);margin:3px 0 0}
.coding-tabs{max-width:1120px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.coding-tabs::-webkit-scrollbar{display:none}
.coding-tabs button{border:0;background:transparent;color:var(--ink-2);padding:10px 14px 11px;border-radius:10px 10px 0 0;border-bottom:2px solid transparent;font:500 13px var(--font);white-space:nowrap;cursor:pointer}
.coding-tabs button:hover{background:color-mix(in srgb,var(--teal-soft) 55%,transparent);color:var(--ink)}
.coding-tabs button[aria-selected=true]{background:var(--card);color:var(--teal);border-bottom-color:var(--teal);font-weight:650}
.coding-stage{position:relative;flex:1;min-height:0;background:var(--paper)}
.coding-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper);display:none}
.coding-stage iframe.on{display:block}
@media(max-width:640px){.coding-top{padding:9px 10px 0}.coding-head{margin-bottom:7px}.coding-head h1{font-size:17px}.coding-head p{max-width:50vw}.coding-tabs button{padding:9px 11px;font-size:12px}}
</style>
<script src="opai-shader.js" defer></script>
</head>
<body>
<section class="coding-top" aria-label="Coding workspace">
  <div class="coding-head"><div><h1>Coding</h1><p>Coding contests, open source and hackathons in one place.</p></div></div>
  <div class="coding-tabs" role="tablist" aria-label="Coding sections" id="coding-tabs">
    <button type="button" role="tab" id="tab-events" data-k="events" aria-selected="true">Hackathons &amp; Programs</button>
  </div>
</section>
<div class="coding-stage" id="coding-stage">
  <iframe id="frame-events" class="on" title="Hackathons, open-source programs and coding contests" data-src="projects.html?view=programs&amp;embed=1"></iframe>
</div>
<script>
(function(){
 var tabs=document.getElementById('coding-tabs'),keys=['events'],loaded={};
 function show(k){if(keys.indexOf(k)<0)k='events';
   keys.forEach(function(x){var on=x===k,b=document.querySelector('[data-k="'+x+'"]'),f=document.getElementById('frame-'+x);b.setAttribute('aria-selected',String(on));f.classList.toggle('on',on);if(on&&!loaded[x]){f.src=f.getAttribute('data-src');loaded[x]=true;}});
   try{localStorage.setItem('opai_coding_tab',k)}catch(e){}
   if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);
   document.title='Hackathons & Programs · Coding · OPAI';
 }
 tabs.addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(b)show(b.dataset.k)});
 tabs.addEventListener('keydown',function(e){if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;var active=document.querySelector('#coding-tabs [aria-selected="true"]'),i=keys.indexOf(active.dataset.k);i=(i+(e.key==='ArrowRight'?1:keys.length-1))%keys.length;show(keys[i]);document.querySelector('[data-k="'+keys[i]+'"]').focus()});
 var start=location.hash.slice(1);try{start=start||localStorage.getItem('opai_coding_tab')||'events'}catch(e){start=start||'events'}show(start);
 addEventListener('hashchange',function(){show(location.hash.slice(1))});
})();
</script>
<script src="opai-clarity.js" defer></script>
<script src="opai-shell.js?v=9" defer></script>
<script src="guide.js" defer></script>
<script src="karna-popup.js" defer></script>
</body>
</html>
