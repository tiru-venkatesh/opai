<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Roadmap · OPAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EE;--s1:#FBF9F6;--s2:#F3EEE6;--s3:#E7DECF;--line:#E0D4C0;--tx:#230D11;--mut:#67393C;--dim:#8F7B6B;--pri:#5C0B16;--pri-soft:#EFEAE0;--coral:#D8A66A;--coral-ink:#AF4251;--coral-soft:#F3EEE5;--ok:#852633;
  --font:'Geist',system-ui,-apple-system,Segoe UI,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/22px var(--font);-webkit-font-smoothing:antialiased}
main{max-width:1100px;margin:0 auto;padding:92px 20px 110px}
h1{font-size:32px;line-height:38px;letter-spacing:-.03em;font-weight:500;margin:0 0 6px;color:var(--pri)}
h2{font-size:16px;line-height:22px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
.tag{color:var(--mut);margin:0 0 22px;max-width:70ch}
.card{background:var(--s1);border:1px solid #E7DECF99;border-radius:16px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start;margin-top:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}main{padding-top:84px}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px;margin-bottom:14px}
.facts div small{display:block;font:11px/14px var(--mono);letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
.facts div b{font-weight:500;font-size:15px}
.bar{height:6px;background:var(--s3);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;font:11px/16px var(--mono);letter-spacing:.03em;background:var(--pri-soft);color:var(--pri)}
.chip.warn{background:var(--coral-soft);color:var(--coral-ink)}
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--s2);border:1px solid #E7DECF}
.seg button{border:0;background:none;padding:3px 11px;border-radius:7px;font:12px/18px var(--font);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.blk{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #E7DECF}
.blk:first-of-type{border-top:0}
.blk .m{font:12px var(--mono);color:var(--pri)}
.lnk{display:inline-block;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--s2);color:var(--pri);text-decoration:none;font:12px/18px var(--font);white-space:nowrap}
.lnk:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--s3);font:500 13px var(--font);cursor:pointer;color:var(--tx)}
.btn:hover{background:#E0D4BF}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.p:hover{background:#721723}
.btn:disabled{opacity:.5;cursor:default}
.mark{margin-top:12px;padding:12px;border-radius:12px;background:var(--s2);border:1px dashed var(--line)}
.mark p{margin:0 0 8px;color:var(--mut);font-size:13px}
.conf{display:inline-flex;gap:6px;margin:0 8px 8px 0}.conf button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--s1);font:500 13px var(--font);cursor:pointer}
.conf button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{padding:5px 0;display:flex;gap:9px}
ul.plain li.d{color:var(--dim);text-decoration:line-through}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:3px;display:grid;place-items:center;font-size:10px;color:#fff}
li.d .dot{background:var(--ok);border-color:var(--ok)}
.days{display:flex;gap:8px;margin-top:10px}
.days span{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:12px var(--mono);border:1px solid var(--line);color:var(--dim);background:var(--s2)}
.days .done{background:var(--pri);color:#fff;border-color:var(--pri)}.days .skipped{background:var(--coral-soft);color:var(--coral-ink);border-color:#E8D8C0}
.days .planned{border-color:var(--pri);color:var(--pri)}.days .missed{opacity:.55}
.rules{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--coral-soft);color:var(--coral-ink);font-size:13px}
.rules b{display:block;margin-bottom:2px}.rules ul{margin:0;padding-left:18px}
details.ph{border:1px solid #E7DECF99;border-radius:14px;background:var(--s1);margin-top:10px;overflow:hidden}
details.ph>summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center;padding:12px 16px;font-weight:500}
details.ph>summary::-webkit-details-marker{display:none}
details.ph>summary .n{font:11px var(--mono);color:var(--dim);width:22px}
details.ph>summary .c{margin-left:auto;font:11px var(--mono);color:var(--mut)}
details.ph>summary::after{content:"+";color:var(--dim);font:16px var(--mono);margin-left:6px}details.ph[open]>summary::after{content:"\2212"}
.tp{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;padding:10px 16px;border-top:1px solid #E7DECF;align-items:center}
@media(max-width:700px){.tp{grid-template-columns:1fr}}
.tp .nm{font-weight:500}.tp .nm em{font:normal 10.5px var(--mono);margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--coral-soft);color:var(--coral-ink)}
.tp .ln{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tp select,.f select,.f input,.ed input,.ed textarea{font:13px var(--font);padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--s2);color:var(--tx)}
.ed{grid-column:1/-1;display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--s2)}.ed input,.ed textarea{width:100%}.ed label{font:11px var(--mono);color:var(--dim)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}.f label{display:block;font:11px var(--mono);letter-spacing:.05em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}.f select{width:100%}
.opt{display:flex;gap:8px;flex-wrap:wrap}.opt label{display:inline-flex;margin:0;text-transform:none;font:13px var(--font);letter-spacing:0;color:var(--tx);cursor:pointer}
.opt input{position:absolute;opacity:0}.opt span{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s2)}.opt input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
.rq{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid #E7DECF;align-items:center}.rq:first-of-type{border-top:0}
.rq small{color:var(--dim);font:11px var(--mono)}.rq .conf{margin:0}.rq .conf button{width:28px;height:28px}
.chip.pause{background:var(--s3);color:var(--mut)}
.hist{display:grid;grid-template-columns:78px 1fr auto;gap:4px 10px;padding:6px 0;border-top:1px solid #E7DECF;font-size:13px}.hist:first-of-type{border-top:0}.hist small{color:var(--dim);font:11px var(--mono)}
.f input[type=number],.f input[type=date]{width:100%}
.err{margin:12px 0;padding:10px 14px;border-radius:10px;background:var(--coral-soft);color:var(--coral-ink)}
.note{margin-top:28px;color:var(--dim);font-size:13px;max-width:75ch}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ghost{background:none;border:0;color:var(--dim);font:12px var(--mono);cursor:pointer;text-decoration:underline;padding:0}
.hero .meta,.hero-today .meta{font:12px/18px var(--mono);color:var(--mut);letter-spacing:.03em}
.lead{font-size:17px;line-height:26px;margin:6px 0 16px;max-width:62ch}
.hero .facts{margin-bottom:12px}
.sec{margin-top:16px}
.eyebrow{display:block;font:11px/14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--coral-ink);margin-bottom:8px}
h2.big{font-size:24px;line-height:30px;font-weight:500;letter-spacing:-.02em;color:var(--pri);margin:0 0 2px}
.steps{margin:14px 0 4px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid #E7DECF}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font:11px var(--mono);flex:none}
.steps li span{flex:1;min-width:180px}.steps li small{font:11px var(--mono);color:var(--dim)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.why{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--pri-soft);color:var(--pri);font-size:13px}
.goal{font-size:12px;color:var(--mut);margin-top:2px}
.capt{display:block;color:var(--dim);font:11px var(--mono);margin-top:-2px}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.strip span{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font:11px/16px var(--mono);color:var(--dim)}
.strip .done{background:var(--pri);color:#fff;border-color:var(--pri)}.strip .cur{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
.tp .tst{font:12px var(--mono);color:var(--mut)}.tp.later .nm,.tp.later .tst{color:var(--dim)}
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ed select{width:100%}.ed .ln{display:flex;gap:8px;flex-wrap:wrap}
details.dr{border:1px solid #E7DECF99;border-radius:14px;background:var(--s1);margin-top:10px;overflow:hidden}
details.dr>summary{cursor:pointer;list-style:none;display:flex;align-items:center;padding:12px 16px;font-weight:500}details.dr>summary::-webkit-details-marker{display:none}
details.dr>summary .c{margin-left:auto;font:11px var(--mono);color:var(--mut)}
details.dr>summary::after{content:"+";color:var(--dim);font:16px var(--mono);margin-left:10px}details.dr[open]>summary::after{content:"\2212"}
details.dr .drb{padding:4px 16px 16px;border-top:1px solid #E7DECF}
@media (prefers-reduced-motion:no-preference){.card,details.ph{animation:up .4s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}

/* ---- phone layout: nothing may be wider than the screen ---- */
.grid2>*,.card,.hero,.hero-today,details.ph,details.dr{min-width:0}
ul.plain li>span,.steps li>span,.rq>div,.hist>span{min-width:0;overflow-wrap:anywhere}
.days{flex-wrap:wrap}
@media(max-width:760px){
  main{padding:76px 12px 96px}
  .card{padding:14px 14px;border-radius:14px}
  .lnk{white-space:normal;max-width:100%;text-align:left}
  h2.big{font-size:21px;line-height:27px}
  .lead{font-size:15px;line-height:23px}
  .facts{grid-template-columns:1fr 1fr;gap:12px}
  .f{grid-template-columns:1fr}
  .actions>.btn,.actions>.lnk{flex:1 1 auto;text-align:center}
  .opt span{padding:8px 14px}
  .conf button{width:40px;height:40px}.rq .conf button{width:36px;height:36px}
  .rq{grid-template-columns:1fr}
  .hist{grid-template-columns:64px 1fr}.hist>*:last-child{grid-column:2}
  .tp{padding:10px 12px}
  details.ph>summary,details.dr>summary{padding:12px}
  .seg{display:flex;flex-wrap:wrap}.seg button{flex:1 1 40%;padding:8px 10px}
  .ed .two{grid-template-columns:1fr}
  .btn,.ghost,select,input,textarea{min-height:40px}
  input,select,textarea{font-size:16px!important}   /* stops iOS zooming into fields */
}
@media(max-width:380px){.facts{grid-template-columns:1fr}}

.trk{margin:16px 0 4px}.trk .cap{display:block;font:11px var(--mono);letter-spacing:.05em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.trk .opt span{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:10px 14px;align-items:flex-start;text-align:left}
.trk .opt small{font:11px/15px var(--mono);opacity:.8;font-weight:400}
.trk .rec{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--pri-soft);color:var(--pri);font-size:13px}.trk .rec:empty{display:none}
@media(max-width:760px){.trk .opt label{flex:1 1 calc(50% - 4px)}.trk .opt label span{width:100%}}
@media(max-width:380px){.trk .opt label{flex-basis:100%}}
</style>

<body>
<main>
  <h1>DSA Roadmap</h1>
  <p class="tag">One realistic next learning block, remembered confidence, and a plan that adapts around your exams.</p>
  <div id="err" class="err" hidden role="alert"></div>
  <div id="app" aria-live="polite"><div class="card">Loading your roadmap…</div></div>
  <p class="note">OPAI plans and tracks. Practice happens on the external sites you choose; you can change each topic's resources under Roadmap → details.</p>
</main>
<script src="opai-shell.js" defer></script>
<script src="guide.js" defer></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DEFAULT_API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8000' : 'https://opa-52ug.onrender.com';
  const base = () => (localStorage.getItem('opa_api_base') || DEFAULT_API).replace(/\/+$/, '');

  async function api(path, opts = {}) {
    const res = await fetch(base() + path, { headers: opts.body ? { 'Content-Type': 'application/json' } : {}, ...opts });
    if (!res.ok) {
      let d = ''; try { d = (await res.json()).detail || ''; } catch (e) {}
      if (Array.isArray(d)) d = d.map((x) => x.msg).join('; ');
      throw new Error(d || (res.status + ' ' + res.statusText));
    }
    const t = await res.text(); return t ? JSON.parse(t) : null;
  }
  let uid = null;
  async function ensureUser() {            // same identity rules as KARNA and Today
    if (uid) return uid;
    const email = new URLSearchParams(location.search).get('email') || localStorage.getItem('opai_sc_email');
    if (email) { localStorage.setItem('opai_sc_email', email); uid = (await api('/v1/auth/dev-login?email=' + encodeURIComponent(email), { method: 'POST' })).user_id; return uid; }
    location.replace('login.html'); throw new Error('Please sign in');
  }

  let S = null, K = null, logOpen = false, showWhy = false, showRoad = false, pendingConf = null, pendingOutcome = 'completed', pendingTags = new Set(); const openPh = new Set(), editing = new Set(), openDr = new Set();
  const err = (m) => { const e = $('err'); e.hidden = !m; e.textContent = m || ''; };

  /* external-link buttons: label by site, only plain http(s) links */
  function lnk(url, kind) {
    if (!url || !/^https?:\/\//i.test(url)) return '';
    let h = ''; try { h = new URL(url).hostname; } catch (e) { return ''; }
    const label = kind === 'practice' ? 'Optional practice' : 'Open learning resource';
    return '<a class="lnk" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + ' <small>' + esc(h.replace(/^www\./, '')) + '</small> ↗</a>';
  }

  function setup(o) {
    const radios = (name, arr, def, fmt) => '<div class="opt">' + arr.map((v) => '<label><input type="radio" name="' + name + '" value="' + esc(v) + '"' + (v === def ? ' checked' : '') + '><span>' + esc(fmt ? fmt(v) : v) + '</span></label>').join('') + '</div>';
    const mins = (o.daily_minutes || []).concat(['custom']);
    return '<section class="card"><h2>Create your DSA roadmap</h2><p class="tag" style="margin-bottom:0">Answer five quick questions. OPAI builds an 11-phase roadmap sized to your daily time (about 10 to 18 weeks), starts it at your level, and puts one small DSA block in Today.</p>' +
      '<div class="trk"><label class="cap">Pick a track (fills the answers below, you can still change them)</label><div class="opt" id="trk-opt">' + (o.tracks || []).map((t) => '<label><input type="radio" name="track" value="' + esc(t.key) + '"><span><b>' + esc(t.name) + '</b><small>' + esc(t.best_for) + '</small></span></label>').join('') + '</div><p class="rec" id="trk-rec" aria-live="polite"></p></div>' +
      '<div class="f"><div><label>1 · Goal</label>' + radios('goal', o.goals, o.goals[0]) + '</div>' +
      '<div><label>2 · Language</label>' + radios('lang', o.languages, 'Python') + '</div>' +
      '<div><label>3 · Current level</label>' + radios('level', o.levels || [], (o.levels || [])[0]) + '</div>' +
      '<div><label>4 · Time available</label>' + radios('mins', mins, 30, (v) => v === 'custom' ? 'Custom' : v === 60 ? '1 hour/day' : v + ' min/day') + '<input id="s-custom" type="number" min="20" max="180" step="5" placeholder="Minutes per day (20-180)" style="margin-top:8px" hidden></div>' +
      '<div><label>Days per week</label>' + radios('dpw', o.days_per_week, 5) + '</div>' +
      '<div><label>5 · Target date (optional)</label><input id="s-target" type="date"></div></div>' +
      '<button class="btn p" data-act="create" type="button">Create roadmap</button></section>';
  }

  const DIFF = { concept: 'Concept', pattern: 'Pattern', implementation: 'Implementation', time: 'Time', resource_unclear: 'Resource unclear', need_practice: 'Need practice', nothing: 'Nothing' };
  const CONF = { 1: 'Still confused', 2: 'Need guided review', 3: 'Understand basics', 4: 'Can explain it', 5: 'Comfortable' };
  const KIND = { learn: 'Learn', revise: 'Revision', review: 'Review' };

  function revQueue(s) {
    if (!s.revision_queue.length) return '<p class="tag" style="margin:0">No reviews are due yet. After you finish a topic, OPAI brings it back for a short recall session based on your confidence.</p>';
    return s.revision_queue.map((q) => '<div class="rq" data-tid="' + esc(q.topic_id) + '"><div><b>' + esc(q.name) + '</b> <small>· ' + q.minutes + ' min · ' + (q.overdue_days > 0 ? 'overdue ' + q.overdue_days + 'd' : 'recall due today') + '</small>' +
      '<div class="goal">Goal: explain ' + esc(q.name) + ' without notes.</div><div class="ln" style="margin-top:4px">' + lnk(q.learn_url, 'learn') + '</div></div>' +
      '<div><small style="display:block">How confident now?</small><div class="conf" role="group" aria-label="Log review of ' + esc(q.name) + '">' + [1, 2, 3, 4, 5].map((v) => '<button type="button" data-act="review" data-v="' + v + '" title="' + CONF[v] + '">' + v + '</button>').join('') + '</div></div></div>').join('');
  }

  function todayCard(s) {
    const t = s.today, m = s.mode;
    let h = '<section class="card hero-today"><small class="eyebrow">Today\'s DSA block</small>';
    if (m.mode === 'paused') return h + '<h2>DSA is paused</h2><p class="tag" style="margin:0">No DSA block today. Your progress and revision dates are kept. Choose Auto or Normal in Settings to resume.</p></section>';
    if (!t) return h + '<h2>Nothing scheduled</h2><p class="tag" style="margin:0">Check back tomorrow.</p></section>';
    const first = t.blocks.find((b) => b.url);
    h += '<h2 class="big">' + esc(t.topic.name) + '</h2><div class="meta">' + t.minutes + ' minutes · ' + (KIND[t.kind] || 'Learn') + ' · ' + esc(t.topic.phase) + (m.mode === 'maintenance' ? ' · Maintenance' : '') + '</div>';
    h += '<ol class="steps">' + t.blocks.map((b) => '<li><span>' + esc(b.label) + '</span><small>' + b.minutes + ' min</small>' + (b.url ? lnk(b.url, b.kind === 'practice' || b.kind === 'revision' ? 'practice' : 'learn') : '') + '</li>').join('') + '</ol>';
    if (t.status === 'done') {
      h += '<div class="mark"><p><b>Done today</b>' + (t.confidence ? ' · confidence ' + t.confidence + '/5 (' + CONF[t.confidence] + ')' : '') + '.</p><p style="margin:0"><b>What next?</b> ' + (t.next_up ? 'Next up: ' + esc(t.next_up) + '. ' : '') + (t.confidence && t.confidence <= 3 ? 'A short review comes back soon before you move on.' : 'Your next block adapts to how this went.') + '</p></div></section>';
      return h;
    }

    try { K = await api('/v1/dsa/streak?user_id=' + encodeURIComponent(uid)); } catch (e) { return; }
    const key = 'opai_dsa_notified', day = new Date().toDateString();
    if (notifyOn() && K.today_status === 'planned' && localStorage.getItem(key) !== day) {
      localStorage.setItem(key, day);
      try { new Notification('OPAI · DSA', { body: 'Today\'s DSA block is waiting. A short session is enough.' }); } catch (e) {}
    }
  }
  (async () => {
    try {
      await ensureUser();
      try { S = await api('/v1/dsa?user_id=' + encodeURIComponent(uid)); }
      catch (e1) {
        if (/^not found$/i.test(e1.message)) {
          throw new Error('The backend at ' + base() + ' is running an older version without the DSA roadmap (/v1/dsa). Redeploy the latest backend code.');
        } else throw e1;
      }
      render(); loadStreak();
    }
    catch (e) { $('app').innerHTML = '<div class="card">Could not reach the OPAI backend at ' + esc(base()) + '. If it is on a free host it may be waking up; retry in a minute.<br><small>' + esc(e.message) + '</small></div>'; }
  })();
})();
</script>
