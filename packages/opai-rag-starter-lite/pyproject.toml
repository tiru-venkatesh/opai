[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opai-rag-starter-lite"
version = "0.1.2"
description = "Small, dependency-light RAG: ingest documents, ask questions, get answers with page-level citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pypdf>=4.0", "python-docx>=1.1"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
embeddings = ["fastembed>=0.2.7"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.28", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
opai-rag = "opai_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
