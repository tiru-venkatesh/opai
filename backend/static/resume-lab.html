<style>
:root{--bg:#F0F4F3;--card:#fff;--ink:#1B1516;--mut:#5C5F63;--pri:#1A404D;--line:#D7E2DF;--warn:#B95F0A;--bad:#C3650E;--good:#245363;--font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/22px var(--font);min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 2px;color:var(--pri)} h2{font-size:17px;margin:0 0 8px}
.sub,.mut{color:var(--mut)} .mut{font-size:13px} .sub{margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;font:500 14px var(--font);color:var(--mut);cursor:pointer;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:600 12px/18px var(--font);background:#EEF2F1;color:var(--pri);margin:2px 4px 2px 0}
.pill.good{background:#E5EDEB;color:var(--good)}.pill.warn{background:#E8EEED;color:var(--warn)}.pill.bad{background:#E9EFEE;color:var(--bad)}
button.b,a.b{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:7px 12px;font:600 13px var(--font);cursor:pointer;text-decoration:none;display:inline-block}
button.b.alt,a.b.alt{background:#fff;color:var(--pri)} button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px var(--font);background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical} label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 3px}
.bar{height:8px;border-radius:99px;background:#E3EBE9;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.note{background:#F0F4F3;border:1px solid #DACFBB;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.bul{border-left:3px solid var(--pri);padding:4px 10px;margin:6px 0;background:#F6F9F8;border-radius:0 8px 8px 0}
ul{margin:4px 0;padding-left:18px}

@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s ease,border-color .2s ease}.card:hover{box-shadow:0 8px 22px rgba(26,64,77,.10)}}

.lib .ltb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--lbd);background:#fbfdfc}
.lib .ltn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}.lib .ltn b{font-size:13px;word-break:break-word}.lib .ltn small{font-size:11px;color:var(--lmu)}
.lib .lta{display:flex;gap:6px;flex-wrap:wrap}

.lib .lpaper p{margin:3px 0}.lib .lpaper ul{margin:3px 0;padding-left:16px}.lib .lpaper li{margin:2px 0}
.lib .lan{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:#fff}
.lib .lsb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#f4faf7,#e8f4ef);border:1px solid #cfe2d8}
.lib .lsb small{font:700 10px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--lt)}.lib .lsb>div:first-child small:last-child{text-transform:none;letter-spacing:0;font-weight:500;color:var(--lmu);display:block;margin-top:2px}
.lib .lbig{font:800 26px/1.1 'Inter',sans-serif;color:#0f172a}.lib .lbig span{font-size:12px;font-weight:600;color:var(--lmu)}
.lib .lring{position:relative;width:64px;height:64px;flex:none}.lib .lring svg{width:64px;height:64px;transform:rotate(-90deg)}.lib .lring>div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--lt)}
.lib .lbars{display:flex;flex-direction:column;gap:9px}
.lib .lm>div{display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:#334155;margin-bottom:3px}.lib .lm b{color:var(--lt)}
.lib .lm i{display:block;height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden}.lib .lm u{display:block;height:100%;background:var(--lt);border-radius:99px;text-decoration:none}
.lib .lact{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib .lact button{padding:8px 4px;text-align:center;border:1px solid var(--lbd);background:#f9fbfb;border-radius:12px;cursor:pointer;font:inherit}
.lib .lact button:hover{border-color:var(--lt);background:#fff}.lib .lact b{display:block;font-size:11.5px}.lib .lact small{font-size:9.5px;color:var(--lmu)}

.lib .ltabs [role=tablist] button:last-child{border-right:0}.lib .ltabs [role=tablist] .on{background:#fff;color:var(--lt);font-weight:700}
.lib .ltp{padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.lib .lsg{padding:8px 10px;border-radius:9px;border:1px solid var(--lbd);background:#f0f5f2}.lib .lsg b{font-size:11.5px}.lib .lsg p{margin:2px 0 0;font-size:11px;line-height:1.45;color:#475569}
.lib .lsg.g{background:rgba(236,253,245,.6);border-color:#a7f3d0}.lib .lsg.a{background:rgba(255,251,235,.7);border-color:#fde68a}.lib .lsg.r{background:#fef2f2;border-color:#fecaca}
.lib .lkw{display:flex;flex-wrap:wrap;gap:4px}.lib .lkw span{padding:2px 8px;border-radius:6px;background:var(--lmint);color:#1b4d45;font:600 10.5px 'Inter',sans-serif}
.lib .lempty{padding:30px}
.lib .lk{margin:14px auto 0;max-width:820px;background:#fff;border:1px solid var(--lbd);border-radius:16px;padding:10px;box-shadow:0 10px 35px -8px rgba(23,73,77,.12)}
.lib .lkr{display:flex;gap:8px}.lib .lkr input{border:0;box-shadow:none;font-size:13px;flex:1}.lib .lkr input:focus{outline:none}
.lib .lkp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9;font-size:10.5px;color:var(--lmu)}
.lib .lkp span{padding:1px 8px;border-radius:99px;background:#f0f5f2;border:1px solid var(--lbd);font-weight:600;color:#334155}
.lib .lkp button{border:0;background:#f1f5f9;border-radius:99px;padding:3px 10px;font:inherit;font-size:10.5px;color:#475569;cursor:pointer}.lib .lkp button:hover{background:var(--lmint);color:#1b4d45}
.lib .lko{margin-top:8px}.lib .lko:empty{display:none}
.lib button.b{background:var(--lt);border-color:var(--lt)}.lib button.b:hover{background:#133E41}
.lib button:focus-visible,.lib input:focus-visible,.lib .ldz:focus-visible{outline:2px solid var(--lt);outline-offset:2px}
@media(max-width:1000px){.lib .lw{grid-template-columns:1fr;height:auto;min-height:0}.lib .lvl{max-height:300px}.lib .lsp{grid-template-columns:1fr}.lib .lpp{max-height:420px;border-right:0;border-bottom:1px solid var(--lbd)}}
</style>

<body>
<main>
  <h1>Resume Lab</h1>
  <p class="sub">One place to score, compare and train your resumes. OPAI learns from your best resume, reuses your own wording and flags gaps; it never invents experience.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view" aria-live="polite"></div>
</main>
<div class="toast" id="toast"></div>
<script src="opai-shell.js" defer></script>
<script>
(function(){
var API=(localStorage.getItem('opa_api_base')||(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8000':'https://opa-52ug.onrender.com')).replace(/\/+$/,'');
var uid=null;
var TABS=[['train','Score & train'],['lib','Library'],['match','Match a posting'],['build','Tailor & export'],['review','ATS review'],['coach','Bullet coach'],['compare','Compare'],['find','Find a bullet'],['ins','Insights']];
var tab=(location.hash||'#train').slice(1);if(!TABS.some(function(t){return t[0]===tab}))tab='lib';
var state={sel:null,pick:null,lastMatch:null,excl:[],extras:[],base:'',preset:null,coachBullet:''};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3500)}
async function api(path,opt){opt=opt||{};var q=path+(path.indexOf('?')<0?'?':'&')+'user_id='+encodeURIComponent(uid);
  var r=await fetch(API+q,{method:opt.method||'GET',headers:{'Content-Type':'application/json'},body:opt.body?JSON.stringify(Object.assign({user_id:uid},opt.body)):undefined});
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){var m=d&&d.detail;if(Array.isArray(m))m=m.map(function(x){return x.msg}).join('; ');throw new Error(m||('Request failed ('+r.status+')'))}return d}
async function ensureUser(){if(uid)return;var e=null;try{e=localStorage.getItem('opai_sc_email')}catch(x){}if(!e){location.replace('app.html');throw new Error('Please sign in')}var r=await fetch(API+'/v1/auth/dev-login?email='+encodeURIComponent(e),{method:'POST'});var d=await r.json();uid=d.user_id}
function pills(a,cls){return (a&&a.length)?a.map(function(x){return '<span class="pill '+(cls||'')+'">'+esc(x)+'</span>'}).join(''):'<span class="mut">none</span>'}
function bar(p){return '<div class="bar" role="img" aria-label="'+esc(p)+' percent"><i style="width:'+Math.max(0,Math.min(100,+p||0))+'%"></i></div>'}
function sel(){return '<label for="opp">Or use a saved opportunity</label><select id="opp"><option value="">None</option></select>'}

function renderTabs(){$('tabs').innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(t[0]===tab)+'" data-k="'+t[0]+'">'+esc(t[1])+'</button>'}).join('')}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(!b)return;tab=b.dataset.k;history.replaceState(null,'','#'+tab);go()});

async function go(){renderTabs();var v=$('view');v.textContent='Loading…';
  try{await ensureUser();await ({train:vTrain,lib:vLib,match:vMatch,build:vBuild,review:vReview,coach:vCoach,compare:vCompare,find:vFind,ins:vIns})[tab](v)}
  catch(e){v.innerHTML='<div class="card">Could not load: '+esc(e.message)+' <button class="b alt" id="retry">Retry</button></div>';$('retry').onclick=go}}

function scrollTo(id){var e=$(id);if(e){e.scrollIntoView({behavior:'smooth',block:'start'});var f=e.querySelector('input,textarea');if(f)setTimeout(function(){f.focus({preventScroll:true})},350)}}
function ringSvg(p,col,txt){return '<div class="lring"><svg viewBox="0 0 36 36"><path stroke="#dfeae5" stroke-width="3.5" fill="none" d="M18 2.0845a15.9155 15.9155 0 0 1 0 31.831a15.9155 15.9155 0 0 1 0-31.831"/><path stroke="'+col+'" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="'+Math.max(0,Math.min(100,p))+', 100" d="M18 2.0845a15.9155 15.9155 0 0 1 0 31.831a15.9155 15.9155 0 0 1 0-31.831"/></svg><div>'+txt+'</div></div>'}
function lbar(label,val,txt){return '<div class="lm"><div><span>'+esc(label)+'</span><b>'+esc(txt)+'</b></div><i><u style="width:'+Math.max(0,Math.min(100,val))+'%"></u></i></div>'}
function paperHtml(text,sections){
  var secs=(sections||[]).map(function(s){return String(s).toLowerCase()}),lines=String(text||'').split(/\r?\n/),out='',inUl=false,first=true;
  function closeUl(){if(inUl){out+='</ul>';inUl=false}}
  lines.forEach(function(raw){var t=raw.trim();if(!t){closeUl();return}
    if(first){first=false;out+='<h2>'+esc(t)+'</h2>';return}
    var b=t.match(/^[-•*▪●◦·]\s*(.+)$/);
    if(b){if(!inUl){out+='<ul>';inUl=true}out+='<li>'+esc(b[1])+'</li>';return}
    closeUl();
    var bare=t.replace(/[:\s]+$/,'').toLowerCase();
    if(secs.indexOf(bare)>=0||(t.length<40&&t===t.toUpperCase()&&/[A-Z]/.test(t)))out+='<h3>'+esc(t)+'</h3>';else out+='<p>'+esc(t)+'</p>'});
  closeUl();return out||'<p class="mut">No text stored.</p>'}
async function vLib(v){
  var d=await api('/v1/resume-lab/library'),vs=d.versions,best=bestOf(vs);
  if(!state.sel||!vs.some(function(r){return r.id===state.sel}))state.sel=(best||vs[0]||{}).id;
  var ranked=vs.slice().sort(function(a,b){return (b.overall_score==null?-1:b.overall_score)-(a.overall_score==null?-1:a.overall_score)});
  var cache=state.cache=state.cache||{};
  var forms='<div class="card" id="addc" style="margin-top:16px"><h2>Add a version</h2><p class="mut">Paste the full text of one resume. Duplicates are skipped, never overwritten. To add files, use the drop zone on the left.</p><div class="grid"><div><label for="lbl">Label</label><input id="lbl" maxlength="80" placeholder="e.g. ML Research v2"></div><div><label for="role">Target role (optional)</label><input id="role" maxlength="120" placeholder="e.g. ML intern"></div></div>'
    +'<label for="txt">Resume text</label><textarea id="txt" style="min-height:90px" placeholder="Paste the full text of one resume"></textarea><div class="row" style="margin-top:8px"><button class="b" id="add">Add to library</button></div></div>';
  v.innerHTML='<div class="lib"><div class="lw"><aside class="la"><div class="lah"><div><b>Versions</b><span class="lcnt">'+esc(d.count)+'</span></div><span><button type="button" class="lt" id="lflt">Filter</button> <button type="button" class="lt pri" id="ladd">+ Add</button></span></div>'
    +'<input id="vq" type="search" class="lq" placeholder="Filter by label or role" aria-label="Filter versions" hidden>'
    +'<div class="lvl" id="vl">'+(vs.length?'':'<div class="mut" style="padding:10px">No resumes yet. Drop a file below or paste one in "Add a version".</div>')+'</div>'
    +'<div class="ldz" id="dz" tabindex="0" role="button" aria-label="Upload resume files"><b>Drag resumes here or <u>Browse</u></b><small>PDF, DOCX or TXT · up to '+esc(d.limit)+' versions</small><span class="mut" id="upmsg"></span><input id="files" type="file" multiple accept=".pdf,.docx,.txt,.md" hidden></div></aside>'
    +'<section class="lc" id="det" aria-live="polite"></section></div>'

async function vReview(v){
  var s=await versionsSelect('rv','Which version?');if(!s.n){v.innerHTML=s.html;return}
  v.innerHTML='<div class="card"><h2>ATS-readiness check</h2>'+s.html+jobBox()+'<div class="row" style="margin-top:8px"><button class="b" id="run">Check this version</button></div></div><div id="out"></div>';
  loadOpps();
  $('run').onclick=async function(){var b=this;btnBusy(b,true);
    try{var r=await api('/v1/resume-lab/review',{method:'POST',body:Object.assign({resume_id:$('rv').value},jobOpt())});
      $('out').innerHTML='<div class="card"><div class="row sp"><h2>'+esc(r.label)+'</h2><span class="pill '+(r.score>=85?'good':r.score>=65?'warn':'bad')+'">'+esc(r.score)+'/100 · '+esc(r.grade)+'</span></div>'+bar(r.score)
        +r.checks.map(function(c){return '<div style="margin:8px 0"><span class="pill '+sev(c.status)+'">'+esc(c.status==='ok'?'OK':c.status==='warn'?'Check':'Fix')+'</span><b>'+esc(c.label)+'</b><div class="mut">'+esc(c.detail)+(c.fix?' '+esc(c.fix):'')+'</div></div>'}).join('')
        +(r.keywords?'<h2 style="margin-top:12px">Posting keywords</h2><div>Present: '+pills(r.keywords.present,'good')+'</div><div>Missing: '+pills(r.keywords.missing,'warn')+'</div><div class="note">'+esc(r.keywords.note)+'</div>':'')
        +'<div class="mut">'+esc(r.method)+'</div></div>'}
    catch(e){toast(e.message)}btnBusy(b,false)}}

async function vCoach(v){
  v.innerHTML='<div class="card"><h2>Improve one bullet</h2><label for="bl">Your bullet</label><textarea id="bl" style="min-height:70px" maxlength="600" placeholder="e.g. Responsible for various tasks in the team"></textarea>'
    +'<label for="facts">True extra details (optional)</label><input id="facts" maxlength="600" placeholder="e.g. used by 200 students; built with Flask">'+jobBox()
    +'<div class="row" style="margin-top:8px"><button class="b" id="run">Coach me</button><span class="mut">Only add numbers that are true.</span></div></div><div id="out"></div>';
  loadOpps();
  if(state.coachBullet){$('bl').value=state.coachBullet;state.coachBullet=''}
  $('run').onclick=async function(){var b=this,t=$('bl').value.trim();if(t.length<3)return toast('Paste a bullet first');btnBusy(b,true);
    try{var r=await api('/v1/resume-lab/coach',{method:'POST',body:Object.assign({bullet:t,facts:$('facts').value.trim()},jobOpt())});
      $('out').innerHTML='<div class="card"><div class="row sp"><h2>Diagnosis</h2><span class="pill '+(r.ok?'good':'warn')+'">'+(r.ok?'Looks solid':'Can be stronger')+'</span></div>'
        +(r.issues.length?r.issues.map(function(i){return '<div style="margin:6px 0"><span class="pill '+(i.severity==='high'?'bad':'warn')+'">'+esc(i.severity)+'</span>'+esc(i.message)+'</div>'}).join(''):'<div class="mut">No problems found.</div>')
        +(r.questions.length?'<h2 style="margin-top:12px">Answer these (honestly)</h2><ul>'+r.questions.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>':'')
        +(r.verb_options.length?'<div>Verbs to start with: '+pills(r.verb_options)+'</div>':'')
        +'<h2 style="margin-top:12px">Shape to aim for</h2><div class="bul">'+esc(r.skeleton)+'</div>'
        +(r.rewrite?'<h2 style="margin-top:12px">Suggested rewrite</h2><div class="bul">'+esc(r.rewrite)+'</div>':'')
        +(r.rewrite_note?'<div class="note">'+esc(r.rewrite_note)+'</div>':'')
        +(r.posting_terms_only_if_true.length?'<div style="margin-top:8px">Posting mentions (use only if true): '+pills(r.posting_terms_only_if_true)+'</div>':'')+'</div>'}
    catch(e){toast(e.message)}btnBusy(b,false)}}

async function vCompare(v){
  var d=await api('/v1/resume-lab/library');
  if(d.versions.length<2){v.innerHTML='<div class="card">Add at least 2 versions to compare.</div>';return}
  var bestC=bestOf(d.versions);
  var opts=d.versions.map(function(r){return '<option value="'+esc(r.id)+'">'+esc(r.label)+(bestC&&r.id===bestC.id?' ★ best':'')+'</option>'}).join('');
  v.innerHTML='<div class="card"><h2>Compare two versions</h2><div class="grid"><div><label for="ca">Version A</label><select id="ca">'+opts+'</select></div><div><label for="cb">Version B</label><select id="cb">'+opts+'</select></div></div>'+jobBox()
    +'<div class="row" style="margin-top:8px"><button class="b" id="run">Compare</button></div></div><div id="out"></div>';
  if(bestC){$('ca').value=bestC.id;var oi=d.versions.findIndex(function(r){return r.id!==bestC.id});$('cb').selectedIndex=oi<0?1:oi}else{$('cb').selectedIndex=1}loadOpps();
  var list=function(a){return a.length?a.map(function(x){return '<div class="bul">'+esc(x)+'</div>'}).join(''):'<div class="mut">None</div>'};
  $('run').onclick=async function(){var b=this;if($('ca').value===$('cb').value)return toast('Pick two different versions');btnBusy(b,true);
    try{var r=await api('/v1/resume-lab/compare',{method:'POST',body:Object.assign({a_id:$('ca').value,b_id:$('cb').value},jobOpt())});
      var dl=r.stats.delta_b_minus_a,pc=function(x){return (x>0?'+':'')+Math.round(100*x)+'%'};
      $('out').innerHTML='<div class="card"><h2>'+esc(r.a.label)+' vs '+esc(r.b.label)+'</h2><div class="grid"><div><b>Numbers in bullets</b><div>'+pc(dl.metric_ratio)+' for B</div></div><div><b>Action verbs</b><div>'+pc(dl.verb_ratio)+' for B</div></div><div><b>Bullet count</b><div>'+(dl.bullets>0?'+':'')+esc(dl.bullets)+' for B</div></div></div>'
        +(r.posting?'<div style="margin-top:8px">Posting coverage: A '+Math.round(100*r.posting.a.coverage)+'% · B '+Math.round(100*r.posting.b.coverage)+'%</div>':'')+'</div>'
        +'<div class="grid"><div class="card"><h2>Only in A</h2>'+list(r.only_in_a)+'</div><div class="card"><h2>Only in B</h2>'+list(r.only_in_b)+'</div></div>'
        +(r.reworded.length?'<div class="card"><h2>Reworded between versions</h2>'+r.reworded.map(function(x){return '<div class="bul"><b>A:</b> '+esc(x.a)+'<br><b>B:</b> '+esc(x.b)+'</div>'}).join('')+'</div>':'')
        +'<div class="card"><h2>Skills</h2><div>Only A: '+pills(r.skills.only_in_a)+'</div><div>Only B: '+pills(r.skills.only_in_b)+'</div><div>Shared: '+pills(r.skills.shared)+'</div></div>'
        +'<div class="card"><h2>Same in both ('+esc(r.common_bullets.length)+')</h2>'+list(r.common_bullets.slice(0,6))+'</div>'}
    catch(e){toast(e.message)}btnBusy(b,false)}}

async function vBuild(v){
  var s=await versionsSelect('bv','Start from which version?');if(!s.n){v.innerHTML=s.html;return}
  state.excl=[];state.extras=[];var pre=state.preset;state.preset=null;
  v.innerHTML='<div class="card"><h2>Tailor a resume for a posting</h2><div class="note">Your wording stays exactly as you wrote it. You choose which of your own bullets stay, and can add bullets from your other versions.</div>'+s.html+jobBox()
    +'<div class="row" style="margin-top:8px"><button class="b" id="pv">Preview</button><button class="b alt" id="sg">Suggest bullets from my other versions</button></div></div><div id="sug"></div><div id="out"></div>';
  loadOpps();
  function body(){return Object.assign({resume_id:$('bv').value,exclude:state.excl,extras:state.extras},jobOpt())}
  function collect(){state.excl=[].slice.call(document.querySelectorAll('input[data-k=in]')).filter(function(x){return !x.checked}).map(function(x){return x.dataset.t});
    state.extras=[].slice.call(document.querySelectorAll('input[data-k=ex]')).filter(function(x){return x.checked}).map(function(x){return {text:x.dataset.t}})}
  async function preview(){
    var r=await api('/v1/resume-lab/build',{method:'POST',body:body()});
    var sec=r.sections.map(function(sc){
      var items=sc.items.map(function(it){return it.kind==='bullet'
        ?'<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:14px;margin:4px 0"><input type="checkbox" data-k="in" checked style="width:auto;margin-top:5px" data-t="'+esc(it.text)+'"><span class="bul" style="margin:0;flex:1">'+esc(it.text)+(it.origin==='other_version'?' <span class="pill good">from another version</span>':'')+'</span></label>'
        :'<div class="mut" style="margin:4px 0">'+esc(it.text)+'</div>'}).join('');
      return (sc.title?'<h2 style="margin-top:12px">'+esc(sc.title)+'</h2>':'')+items}).join('');
    var dr=r.dropped.length?'<h2 style="margin-top:12px">Left out</h2>'+r.dropped.map(function(t){return '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--mut);font-size:14px;margin:4px 0"><input type="checkbox" data-k="in" style="width:auto;margin-top:5px" data-t="'+esc(t)+'"><span>'+esc(t)+'</span></label>'}).join(''):'';
    $('out').innerHTML='<div class="card"><div class="row sp"><h2>Preview · '+esc(r.bullets)+' bullets</h2><span class="pill '+(r.review.score>=85?'good':r.review.score>=65?'warn':'bad')+'">ATS check '+esc(r.review.score)+'/100</span></div>'+sec+dr
      +'<div class="row" style="margin-top:12px"><button class="b alt" id="up">Update preview</button></div></div>'
      +'<div class="card"><h2>Use it</h2><div class="row"><button class="b" data-f="docx">Download Word</button><button class="b" data-f="pdf">Download PDF</button><button class="b alt" data-f="txt">Download text</button></div>'
      +'<h2 style="margin-top:14px">Attach to an application</h2><div class="row"><select id="ap" style="flex:1"><option value="">Choose an application</option></select><button class="b" id="at">Attach</button></div>'
      +'<div class="mut" style="margin-top:6px">Saves this as a version in your library and links it to the application. Nothing is submitted.</div></div>';
    $('up').onclick=async function(){collect();try{await preview()}catch(e){toast(e.message)}};
    document.querySelectorAll('button[data-f]').forEach(function(bn){bn.onclick=function(){collect();download(bn.dataset.f,body(),bn)}});
    try{var apps=await fetch(API+'/v1/applications?user_id='+encodeURIComponent(uid)).then(function(x){return x.json()});
      apps.forEach(function(a){var o=document.createElement('option');o.value=a.id;o.textContent=a.role+' · '+a.company;$('ap').appendChild(o)})}catch(e){}
    $('at').onclick=async function(){if(!$('ap').value)return toast('Choose an application first');collect();var b=this;btnBusy(b,true);
      try{var a=await api('/v1/resume-lab/attach',{method:'POST',body:Object.assign(body(),{application_id:$('ap').value})});toast(a.replaced_previous?'Updated the attached version':'Attached: '+a.label)}
      catch(e){toast(e.message)}btnBusy(b,false)}}
  async function download(fmt,b,btn){btnBusy(btn,true);
    try{var r=await fetch(API+'/v1/resume-lab/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({user_id:uid,format:fmt},b))});
      if(!r.ok){var d=null;try{d=await r.json()}catch(e){}throw new Error((d&&d.detail)||('Export failed ('+r.status+')'))}
      var blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Tailored resume.'+fmt;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}
    catch(e){toast(e.message)}btnBusy(btn,false)}
  $('pv').onclick=async function(){var b=this;btnBusy(b,true);state.excl=[];state.extras=[].slice.call(document.querySelectorAll('input[data-k=ex]')).filter(function(x){return x.checked}).map(function(x){return {text:x.dataset.t}});try{await preview()}catch(e){toast(e.message)}btnBusy(b,false)};
  $('sg').onclick=async function(){var b=this,jb=jobOpt();if(!jb.job_text&&!jb.opportunity_id)return toast('Paste a posting or choose an opportunity first');btnBusy(b,true);
    try{var r=await api('/v1/resume-lab/tailor',{method:'POST',body:Object.assign({resume_id:$('bv').value},jb)});
      $('sug').innerHTML='<div class="card"><h2>From your other versions</h2>'+(r.consider_from_other_versions.length?r.consider_from_other_versions.map(function(x){
        return '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:14px;margin:4px 0"><input type="checkbox" data-k="ex" style="width:auto;margin-top:5px" data-t="'+esc(x.bullet)+'"><span class="bul" style="margin:0;flex:1">'+esc(x.bullet)+'<div class="mut">from '+esc(x.from)+'</div></span></label>'}).join('')+'<div class="mut">Tick the ones to add, then press Preview or Update preview.</div>':'<div class="mut">Nothing relevant in your other versions.</div>')+'</div>'}
    catch(e){toast(e.message)}btnBusy(b,false)}
  if(pre){$('bv').value=pre.base;
    if(pre.extras&&pre.extras.length)$('sug').innerHTML='<div class="card"><h2>From your best resume</h2>'+pre.extras.map(function(t){
      return '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:14px;margin:4px 0"><input type="checkbox" data-k="ex" checked style="width:auto;margin-top:5px" data-t="'+esc(t)+'"><span class="bul" style="margin:0;flex:1">'+esc(t)+'</span></label>'}).join('')+'<div class="mut">Untick any you do not want, then press Update preview.</div></div>';
    $('pv').click()}}

async function vFind(v){
  v.innerHTML='<div class="card"><h2>Search your own bullets</h2><div class="row"><input id="q" placeholder="e.g. deployed an API, improved accuracy" style="flex:1"><button class="b" id="s">Search</button></div></div><div id="out"></div>';
  async function run(){var q=$('q').value.trim();if(q.length<2)return;
    try{var r=await api('/v1/resume-lab/bullets/search',{method:'POST',body:{query:q,k:8}});
      $('out').innerHTML=r.results.length?r.results.map(function(x){return '<div class="card"><div>'+esc(x.bullet)+'</div><div class="mut">'+esc(x.from)+' · '+esc(x.section)+'</div></div>'}).join(''):'<div class="card mut">No matching bullets.</div>'}catch(e){toast(e.message)}}
  $('s').onclick=run;$('q').addEventListener('keydown',function(e){if(e.key==='Enter')run()})}

async function vIns(v){
  var d=await api('/v1/resume-lab/insights');
  if(!d.ready){v.innerHTML='<div class="card">'+esc(d.note)+'</div>';return}
  var t=d.traits,pc=function(x){return x==null?'–':Math.round(100*x)+'%'};
  v.innerHTML='<div class="card"><h2>Your strongest versions</h2>'+pills(d.best_versions,'good')+'<p class="mut">Compared with the rest of your library.</p>'
    +'<div class="grid"><div><b>Bullets with numbers</b><div>'+pc(t.metric_ratio.best)+' vs '+pc(t.metric_ratio.others)+'</div></div>'
    +'<div><b>Start with an action verb</b><div>'+pc(t.verb_ratio.best)+' vs '+pc(t.verb_ratio.others)+'</div></div></div></div>'
    +'<div class="card"><h2>What to fix</h2>'+(d.tips.length?'<ul>'+d.tips.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<span class="mut">Nothing stands out.</span>')+'</div>'
    +'<div class="card"><h2>Skills</h2><b>Common to most versions</b><div>'+pills(d.common_skills)+'</div><b>Only in one version</b><div>'+pills(d.skills_in_only_one_version)+'</div></div>'
    +'<p class="mut">'+esc(d.basis)+'</p>'}
go();
})();
</script>
<script src="opai-clarity.js" defer></script>
