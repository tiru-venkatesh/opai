<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume Lab · OPAI</title>
<meta name="theme-color" content="#F0F4F3">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opai-shared.css"><link rel="stylesheet" href="opai-theme.css"><link rel="stylesheet" href="opai-motion2.css"><script src="opai-session.js"></script><script src="opai-ux.js"></script>
<style>
:root{--bg:#F0F4F3;--card:#fff;--ink:#1B1516;--mut:#5C5F63;--pri:#1A404D;--line:#D7E2DF;--warn:#B95F0A;--bad:#C3650E;--good:#245363;--font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/22px var(--font);min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 2px;color:var(--pri)} h2{font-size:17px;margin:0 0 8px}
.sub,.mut{color:var(--mut)} .mut{font-size:13px} .sub{margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;font:500 14px var(--font);color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:600 12px/18px var(--font);background:#EEF2F1;color:var(--pri);margin:2px 4px 2px 0}
.pill.good{background:#E5EDEB;color:var(--good)}.pill.warn{background:#E8EEED;color:var(--warn)}.pill.bad{background:#E9EFEE;color:var(--bad)}
button.b,a.b{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:7px 12px;font:600 13px var(--font);cursor:pointer;text-decoration:none;display:inline-block}
button.b.alt,a.b.alt{background:#fff;color:var(--pri)} button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px var(--font);background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical} label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 3px}
.bar{height:8px;border-radius:99px;background:#E3EBE9;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.note{background:#F0F4F3;border:1px solid #DACFBB;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.bul{border-left:3px solid var(--pri);padding:4px 10px;margin:6px 0;background:#F6F9F8;border-radius:0 8px 8px 0}
ul{margin:4px 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;display:none;z-index:99}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s ease,border-color .2s ease}.card:hover{box-shadow:0 8px 22px rgba(26,64,77,.10)}}
.lib{--pri:#0f5257;--pri-d:#0d464a;--sage:#e3ece8;--sub:#f1f4f3;--faint:#829590;--line:rgba(15,82,87,.12);--line2:rgba(15,82,87,.22);--disp:'Space Grotesk',var(--font);--mono:'JetBrains Mono',ui-monospace,monospace;font-family:'Inter',var(--font)}
.lib button.b{background:#0f5257;border-color:#0f5257}.lib button.b.alt{background:#fff;color:#142123;border-color:rgba(15,82,87,.22)}.lib .bar i{background:#0f5257}.lib .pill{background:#e3ece8;color:#0f5257}.lib .pill.good{background:rgba(22,163,74,.12);color:#15803d}.lib .pill.warn{background:#fdf0e3;color:#b95f0a}.lib .pill.bad{background:#fde9e0;color:#c2410c}
.lib .ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.lib /* library workspace */
.ws{display:grid;gap:16px;grid-template-columns:minmax(0,4fr) minmax(0,8fr);align-items:start}
@media(max-width:900px){.lib .ws{grid-template-columns:1fr}}
.lib .side{padding:16px}
.lib .vlist{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow-y:auto;margin-top:10px;padding-right:2px}
.lib .vi{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.lib .vi:hover{background:var(--bg);border-color:var(--line2)}
.lib .vi.sel{background:var(--sub);border-color:var(--line2)}
.lib .vi.sel:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--pri)}
.lib .vi .ic{width:32px;height:32px;border-radius:9px;background:var(--sage);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none;font:700 13px var(--disp)}
.lib .vi.sel .ic{background:var(--pri);color:#fff}
.lib .vi b{font-size:12.5px;display:block;word-break:break-word}
.lib .vi small{display:block;color:var(--mut);font-size:11px}
.lib .lib .mono{font-family:var(--mono)}
.lib .detail-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.lib .split{display:grid;gap:16px;grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
@media(max-width:760px){.lib .split{grid-template-columns:1fr}}
.lib .paper{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;max-height:420px;overflow:auto;font:12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap;word-break:break-word}
.lib .diag{background:#f8faf9;border:1px solid var(--line);border-radius:12px;padding:16px}
.lib .ringbox{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 14px}
.lib .ring{position:relative;width:76px;height:76px;flex:none}
.lib .ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.lib .ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 20px/1 var(--disp)}
.lib .ring small{font:400 9px var(--mono);color:var(--mut)}
.lib .met{margin:10px 0}
.lib .met .row{font-size:12px;font-weight:600;flex-wrap:nowrap;gap:12px}
.lib .met .mono{color:var(--pri);font-weight:700}
.lib .two{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.lib .two{grid-template-columns:1fr}}
.lib .qa{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:10px}
.lib .qa button{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font:inherit;color:inherit}
.lib .qa button:hover{background:#fff;border-color:var(--line2);box-shadow:0 10px 25px -4px rgba(15,82,87,.1)}
.lib .qa b{display:block;font-size:12.5px}
.lib .qa small{color:var(--mut);font-size:11px;line-height:1.3;display:block}
.lib .ir{padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.lib .ir b{font-size:12.5px;display:block}
.lib .ir span{font-size:12px;color:var(--mut)}
</style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};if(!/[?&]embed=1/.test(location.search)&&location.protocol!=='file:'&&!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)){var s=document.createElement("script");s.defer=true;s.src="/_vercel/insights/script.js";document.head.appendChild(s)}</script>

</head>
<body>
<main>
  <h1>Resume Lab</h1>
  <p class="sub">One place to score, compare and train your resumes. OPAI learns from your best resume, reuses your own wording and flags gaps; it never invents experience.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view" aria-live="polite"></div>
</main>
<div class="toast" id="toast"></div>
<script src="opai-shell.js" defer></script>
<script>
(function(){
var API=(localStorage.getItem('opa_api_base')||(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8000':'https://opa-52ug.onrender.com')).replace(/\/+$/,'');
var uid=null;
var TABS=[['train','Score & train'],['lib','Library'],['match','Match a posting'],['build','Tailor & export'],['review','ATS review'],['coach','Bullet coach'],['compare','Compare'],['find','Find a bullet'],['ins','Insights']];
var tab=(location.hash||'#train').slice(1);if(!TABS.some(function(t){return t[0]===tab}))tab='lib';
var state={sel:null,pick:null,lastMatch:null,excl:[],extras:[],base:'',preset:null,coachBullet:''};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3500)}
async function api(path,opt){opt=opt||{};var q=path+(path.indexOf('?')<0?'?':'&')+'user_id='+encodeURIComponent(uid);
  var r=await fetch(API+q,{method:opt.method||'GET',headers:{'Content-Type':'application/json'},body:opt.body?JSON.stringify(Object.assign({user_id:uid},opt.body)):undefined});
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){var m=d&&d.detail;if(Array.isArray(m))m=m.map(function(x){return x.msg}).join('; ');throw new Error(m||('Request failed ('+r.status+')'))}return d}
async function ensureUser(){if(uid)return;var e=null;try{e=localStorage.getItem('opai_sc_email')}catch(x){}if(!e){location.replace('app.html');throw new Error('Please sign in')}var r=await fetch(API+'/v1/auth/dev-login?email='+encodeURIComponent(e),{method:'POST'});var d=await r.json();uid=d.user_id}
function pills(a,cls){return (a&&a.length)?a.map(function(x){return '<span class="pill '+(cls||'')+'">'+esc(x)+'</span>'}).join(''):'<span class="mut">none</span>'}
function bar(p){return '<div class="bar" role="img" aria-label="'+esc(p)+' percent"><i style="width:'+Math.max(0,Math.min(100,+p||0))+'%"></i></div>'}
function sel(){return '<label for="opp">Or use a saved opportunity</label><select id="opp"><option value="">None</option></select>'}

function renderTabs(){$('tabs').innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(t[0]===tab)+'" data-k="'+t[0]+'">'+esc(t[1])+'</button>'}).join('')}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(!b)return;tab=b.dataset.k;history.replaceState(null,'','#'+tab);go()});

async function go(){renderTabs();var v=$('view');v.textContent='Loading…';
  try{await ensureUser();await ({train:vTrain,lib:vLib,match:vMatch,build:vBuild,review:vReview,coach:vCoach,compare:vCompare,find:vFind,ins:vIns})[tab](v)}
  catch(e){v.innerHTML='<div class="card">Could not load: '+esc(e.message)+' <button class="b alt" id="retry">Retry</button></div>';$('retry').onclick=go}}

function ring(p,tone,txt){var c=tone||'#0f5257';return '<div class="ring"><svg viewBox="0 0 36 36"><path stroke="#e3ece8" stroke-width="3.5" fill="none" d="M18 2.0845a15.9155 15.9155 0 0 1 0 31.831a15.9155 15.9155 0 0 1 0-31.831"/><path stroke="'+c+'" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="'+Math.max(0,Math.min(100,p))+', 100" d="M18 2.0845a15.9155 15.9155 0 0 1 0 31.831a15.9155 15.9155 0 0 1 0-31.831"/></svg><div>'+txt+'</div></div>'}
function met(label,val,txt){return '<div class="met"><div class="row sp"><span>'+esc(label)+'</span><span class="mono">'+esc(txt)+'</span></div>'+bar(val)+'</div>'}
function scrollTo(id){var e=$(id);if(e){e.scrollIntoView({behavior:'smooth',block:'start'});var f=e.querySelector('input,textarea');if(f)setTimeout(function(){f.focus({preventScroll:true})},350)}}
async function vLib(v){
  var d=await api('/v1/resume-lab/library'),vs=d.versions;
  var best=bestOf(vs),q='';
  if(!state.sel||!vs.some(function(r){return r.id===state.sel}))state.sel=(best||vs[0]||{}).id;
  var ranked=vs.slice().sort(function(a,b){return (b.overall_score==null?-1:b.overall_score)-(a.overall_score==null?-1:a.overall_score)});
  var forms='<div class="two"><div class="card" id="upc"><h2>Upload your resumes</h2><p class="mut">Select up to 10 PDF, DOCX or TXT files at once. Each bullet is indexed so Match and Tailor can reuse your best lines.</p>'
    +'<label for="files">Resume files</label><input id="files" type="file" multiple accept=".pdf,.docx,.txt,.md"><label for="frole">Target role for all (optional)</label><input id="frole" maxlength="120" placeholder="e.g. ML intern">'
    +'<div class="row" style="margin-top:8px"><button class="b" id="upl">Upload and index</button><span class="mut" id="upmsg"></span></div></div>'
    +'<div class="card" id="addc"><h2>Add a version</h2><label for="lbl">Label</label><input id="lbl" maxlength="80" placeholder="e.g. ML Research v2">'
    +'<label for="role">Target role (optional)</label><input id="role" maxlength="120" placeholder="e.g. ML intern">'
    +'<label for="txt">Resume text</label><textarea id="txt" style="min-height:90px" placeholder="Paste the full text of one resume"></textarea>'
    +'<div class="row" style="margin-top:8px"><button class="b" id="add">Add to library</button><span class="mut">Duplicates are skipped, never overwritten.</span></div></div></div>';
  var h='<div class="lib"><div class="ws"><aside class="card side"><div class="row sp"><h2 style="margin:0">Your versions <span class="pill mono">'+esc(d.count)+'</span></h2><button class="b" id="newv">+ Add version</button></div>'
    +'<p class="mut" style="margin:4px 0 8px">Up to '+esc(d.limit)+' versions. Pick one to see its details.</p>'
    +(vs.length?'<input id="vq" type="search" placeholder="Filter versions by label or role" aria-label="Filter versions"><div class="vlist" id="vl"></div>':'<div class="note">No resumes yet. Upload files or paste one below.</div>')
    +'</aside><section id="det" aria-live="polite"></section></div>'+forms+'</div>';
  v.innerHTML=h;
  function list(){var f=(($('vq')||{}).value||'').toLowerCase();
    $('vl').innerHTML=ranked.filter(function(r){return !f||(r.label+' '+(r.target_role||'')).toLowerCase().indexOf(f)>=0}).map(function(r){var sc=r.overall_score;
      return '<button type="button" class="vi'+(r.id===state.sel?' sel':'')+'" data-id="'+esc(r.id)+'"><span class="ic">'+esc((r.label||'?').charAt(0).toUpperCase())+'</span><span style="flex:1;min-width:0"><b>'+esc(r.label)+(best&&r.id===best.id?' <span class="pill good">★ best</span>':'')+'</b><small>'+esc(r.target_role||'No target role')+'</small><small class="mono">'+esc(r.words)+' words · '+esc(r.bullets)+' bullets</small></span><span class="pill '+(sc==null?'':sc>=7?'good':sc>=5?'warn':'bad')+'">'+esc(sc==null?'–':sc)+'/10</span></button>'}).join('')||'<div class="mut">No match.</div>'}
  async function detail(){
    var r=vs.filter(function(x){return x.id===state.sel})[0],el=$('det');if(!r){el.innerHTML='<div class="card"><h2>Nothing selected</h2><p class="mut">Add a resume to see its score, text and insights here.</p></div>';return}
    var sc=r.overall_score,tone=sc==null?'#829590':sc>=7?'#16a34a':sc>=5?'#b95f0a':'#c2410c',rank=ranked.indexOf(r)+1;
    el.innerHTML='<div class="card"><div class="detail-h"><div><div class="row"><h2 style="margin:0;font-size:18px">'+esc(r.label)+'</h2>'+(best&&r.id===best.id?'<span class="pill good">Best version</span>':'')+'</div>'
      +'<div class="mut mono" style="margin-top:4px">'+esc(r.words)+' words · '+esc(r.bullets)+' bullets · '+esc((r.sections||[]).length)+' sections'+(r.target_role?' · <span style="font-family:var(--font);font-weight:600;color:var(--pri)">'+esc(r.target_role)+'</span>':'')+'</div></div>'
      +'<div class="row"><button class="b alt" id="d-rv">ATS review</button><button class="b" id="d-tl">Tailor &amp; export</button></div></div>'
      +'<div class="split"><div><div class="mut" style="font-weight:600;margin-bottom:6px">Resume text</div><div class="paper" id="paper" tabindex="0">Loading…</div></div>'
      +'<div class="diag"><div class="row sp"><b style="font-size:11px;letter-spacing:.06em;text-transform:uppercase">Score &amp; diagnostics</b></div>'
      +'<div class="ringbox">'+ring(sc==null?0:sc*10,tone,(sc==null?'–':esc(sc))+'<small>/10</small>')+'<div><b style="font-size:13px">Overall score: '+(sc==null?'not scored yet':esc(sc)+'/10')+'</b><div class="mut">Ranked #'+rank+' of '+vs.length+' in your library.</div></div></div>'
      +met('ATS readiness',0,'checking…').replace('class="met"','class="met" id="m-ats"')
      +met('Bullets with numbers',100*r.metric_ratio,Math.round(100*r.metric_ratio)+'%')+met('Bullets starting with action verbs',100*r.verb_ratio,Math.round(100*r.verb_ratio)+'%')
      +(r.weak&&r.weak.length?'<div class="mut" style="margin-top:8px">Weak phrases: '+pills(r.weak.slice(0,5),'warn')+'</div>':'')
      +'<div style="margin-top:8px">'+pills((r.skills||[]).slice(0,8))+'</div></div></div></div>'
      +'<div class="two"><div class="card"><h2>Quick actions</h2><div class="qa"><button type="button" data-q="up"><b>Upload resume</b><small>PDF, DOCX or TXT</small></button><button type="button" data-q="new"><b>Add a version</b><small>Paste text</small></button><button type="button" data-q="match"><b>Match a posting</b><small>Rank versions for a job</small></button><button type="button" data-q="fb"><b>Get feedback</b><small>Coach a weak bullet</small></button></div></div>'
      +'<div class="card" id="insc"><h2>Resume insights</h2><div class="mut">Loading…</div></div></div>';
    $('d-rv').onclick=function(){state.pick=r.id;goTab('review')};$('d-tl').onclick=function(){state.preset={base:r.id,extras:[]};goTab('build')};
    [].forEach.call(el.querySelectorAll('[data-q]'),function(b){b.onclick=function(){var k=b.dataset.q;if(k==='up')scrollTo('upc');else if(k==='new')scrollTo('addc');else if(k==='match')goTab('match');else goTab('coach')}});
    var sid=state.sel;
    fetch(API+'/v1/resumes/'+encodeURIComponent(r.id)).then(function(x){return x.json()}).then(function(x){if(sid===state.sel&&$('paper'))$('paper').textContent=x.raw_text||'No text stored.'}).catch(function(){if($('paper'))$('paper').textContent='Could not load the resume text.'});
    api('/v1/resume-lab/review',{method:'POST',body:{resume_id:r.id}}).then(function(x){if(sid!==state.sel||!$('m-ats'))return;$('m-ats').outerHTML=met('ATS readiness',x.score,x.score+'/100').replace('class="met"','class="met" id="m-ats"')}).catch(function(){if($('m-ats'))$('m-ats').remove()});
    api('/v1/resume-lab/insights').then(function(i){if(!$('insc'))return;
      if(!i.ready){$('insc').innerHTML='<h2>Resume insights</h2><div class="mut">'+esc(i.note)+'</div>';return}
      var pc=function(x){return x==null?'–':Math.round(100*x)+'%'},t=i.traits;
      $('insc').innerHTML='<div class="row sp"><h2 style="margin:0">Resume insights</h2><button class="b alt" id="i-all">View all</button></div>'
        +'<div class="ir"><b>Strongest versions</b><span>'+esc(i.best_versions.join(', ')||'–')+' · numbers in '+pc(t.metric_ratio.best)+' of bullets vs '+pc(t.metric_ratio.others)+' elsewhere</span></div>'
        +'<div class="ir"><b>Gaps to improve</b><span>'+(i.tips.length?esc(i.tips[0])+(i.tips.length>1?' (+'+(i.tips.length-1)+' more)':''):'Nothing stands out.')+'</span></div>'
        +'<div class="ir"><b>Skills</b><span>'+esc((i.common_skills||[]).slice(0,5).join(', ')||'–')+(i.skills_in_only_one_version.length?' · '+i.skills_in_only_one_version.length+' appear in only one version':'')+'</span></div>';
      $('i-all').onclick=function(){goTab('ins')}}).catch(function(){if($('insc'))$('insc').remove()})}
  if(vs.length){list();detail();$('vq').oninput=list;
    $('vl').onclick=function(e){var b=e.target.closest('.vi');if(!b)return;state.sel=b.dataset.id;list();detail()}}
  else detail();
  $('newv').onclick=function(){scrollTo('addc')};
  $('upl').onclick=async function(){var b=this,fs=$('files').files;if(!fs.length){toast('Choose at least one file');return}
    b.disabled=true;$('upmsg').textContent='Uploading…';
    try{var fd=new FormData();fd.append('user_id',uid);if($('frole').value.trim())fd.append('target_role',$('frole').value.trim());for(var i=0;i<fs.length;i++)fd.append('files',fs[i]);
      var res=await fetch(API+'/v1/resume-lab/import-files',{method:'POST',body:fd});var r=await res.json();
      if(!res.ok)throw new Error(typeof r.detail==='string'?r.detail:'Upload failed');
      toast(r.created.length+' added'+(r.skipped.length?', '+r.skipped.length+' skipped: '+r.skipped.map(function(x){return x.label+' ('+x.reason+')'}).join('; '):''));go()}
    catch(e){toast(e.message);b.disabled=false;$('upmsg').textContent=''}};

/* ---------- shared helpers for the newer tabs ---------- */
function bestOf(vs){var sc=vs.filter(function(r){return r.overall_score!=null});if(!sc.length)return null;
  sc.sort(function(a,b){return (b.overall_score-a.overall_score)||(b.metric_ratio-a.metric_ratio)});return sc[0]}
function goTab(t){tab=t;history.replaceState(null,'','#'+t);go()}
async function versionsSelect(id,label){var d=await api('/v1/resume-lab/library');

  var pk=state.pick;state.pick=null;return {n:d.versions.length,best:best&&best.id,html:'<label for="'+id+'">'+esc(label)+'</label><select id="'+id+'">'+d.versions.map(function(r){var bb=best&&r.id===best.id,pp=pk?r.id===pk:bb;return '<option value="'+esc(r.id)+'"'+(pp?' selected':'')+'>'+esc(r.label)+(bb?' ★ best':'')+'</option>'}).join('')+'</select>'}}
function jobBox(){return '<label for="job">Posting text (optional)</label><textarea id="job" style="min-height:90px" placeholder="Paste a posting to check keywords against"></textarea>'+sel()}
function jobOpt(){var t=($('job')||{}).value,o=($('opp')||{}).value;t=(t||'').trim();return t?{job_text:t}:(o?{opportunity_id:o}:{})}
function sev(s){return s==='ok'?'good':s==='warn'?'warn':'bad'}

/* ---------- Score & train: score every resume, then learn from the best one ---------- */
async function vTrain(v){
  var d=await api('/v1/resume-lab/library'),vs=d.versions;
  if(!vs.length){v.innerHTML='<div class="card"><h2>Start here</h2>Upload your resumes in the <b>Library</b> tab (up to '+esc(d.limit)+'). They are scored and ranked here, and your best one becomes the reference.<div class="row" style="margin-top:8px"><button class="b" id="tolib">Open Library</button></div></div>';$('tolib').onclick=function(){goTab('lib')};return}
  var best=bestOf(vs)||vs[0],tone=function(n){return n>=7?'good':n>=5?'warn':'bad'};
  var ranked=vs.slice().sort(function(a,b){return (b.overall_score==null?-1:b.overall_score)-(a.overall_score==null?-1:a.overall_score)});
  var h='<div class="card"><h2>1. Score your resumes</h2><p class="mut">Ranked best first. The top one is your reference for training.</p>'
    +ranked.map(function(r){var sc=r.overall_score;return '<div style="margin:10px 0"><div class="row sp"><b>'+(r.id===best.id?'★ ':'')+esc(r.label)+'</b><span><span class="pill" data-ats="'+esc(r.id)+'">ATS …</span><span class="pill '+(sc==null?'':tone(sc))+'">'+esc(sc==null?'–':sc)+'/10</span></span></div>'
      +bar(sc==null?0:sc*10)+'<div class="mut">'+esc(r.target_role||'No target role')+' · numbers in '+Math.round(100*r.metric_ratio)+'% of bullets · action verbs in '+Math.round(100*r.verb_ratio)+'%</div></div>'}).join('')+'</div>';
  var others=vs.filter(function(r){return r.id!==best.id});
  if(!others.length){h+='<div class="card"><h2>2. Train with your best</h2>Add one more resume version in the Library tab. Training compares a version with your best and finds what to fix.</div>'}
  else{
    var weakest=others.slice().sort(function(a,b){return (a.overall_score==null?99:a.overall_score)-(b.overall_score==null?99:b.overall_score)})[0];
    h+='<div class="card"><h2>2. Train a version with your best</h2><p class="mut">Reference: <b>★ '+esc(best.label)+'</b>. OPAI compares it with the version you pick, shows what your best does better, and checks the weak bullets. Only your own wording is used; nothing is invented.</p>'
      +'<label for="tv">Version to train</label><select id="tv">'+others.map(function(r){return '<option value="'+esc(r.id)+'"'+(r.id===weakest.id?' selected':'')+'>'+esc(r.label)+'</option>'}).join('')+'</select>'+jobBox()
      +'<div class="row" style="margin-top:8px"><button class="b" id="tr">Train</button><button class="b alt" id="fb">Tailor a new resume from my best</button></div></div><div id="out"></div>'}
  v.innerHTML=h;loadOpps();
  vs.forEach(function(r){api('/v1/resume-lab/review',{method:'POST',body:{resume_id:r.id}}).then(function(x){var el=document.querySelector('[data-ats="'+r.id+'"]');if(el){el.textContent='ATS '+x.score+'/100';el.className='pill '+(x.score>=85?'good':x.score>=65?'warn':'bad')}}).catch(function(){var el=document.querySelector('[data-ats="'+r.id+'"]');if(el)el.remove()})});
  if(!others.length)return;
  $('fb').onclick=function(){state.preset={base:best.id,extras:[]};goTab('build')};
  $('tr').onclick=async function(){var b=this;btnBusy(b,true);$('out').innerHTML='<div class="card mut">Comparing with your best…</div>';
    try{var tid=$('tv').value,jo=jobOpt();
      var res=await Promise.all([api('/v1/resume-lab/compare',{method:'POST',body:Object.assign({a_id:best.id,b_id:tid},jo)}),api('/v1/resume-lab/review',{method:'POST',body:Object.assign({resume_id:tid},jo)})]);
      var c=res[0],rv=res[1],sa=c.stats.a,sb=c.stats.b,pc=function(x){return Math.round(100*x)+'%'};
      var cand=c.only_in_b.slice(0,8);
      var coached=await Promise.all(cand.map(function(t){return api('/v1/resume-lab/coach',{method:'POST',body:Object.assign({bullet:t,use_ai:false},jo)}).then(function(x){return {t:t,c:x}}).catch(function(){return null})}));
      var weak=coached.filter(function(x){return x&&x.c&&!x.c.ok}).slice(0,6);
      var fails=rv.checks.filter(function(x){return x.status!=='ok'}).slice(0,4);
      var o='<div class="card"><div class="row sp"><h2>★ '+esc(c.a.label)+' vs '+esc(c.b.label)+'</h2><span class="pill '+(rv.score>=85?'good':rv.score>=65?'warn':'bad')+'">ATS '+esc(rv.score)+'/100</span></div><div class="grid">'
        +'<div><b>Numbers in bullets</b><div>Best '+pc(sa.metric_ratio)+' · this '+pc(sb.metric_ratio)+'</div></div>'
        +'<div><b>Action verbs</b><div>Best '+pc(sa.verb_ratio)+' · this '+pc(sb.verb_ratio)+'</div></div>'
        +'<div><b>Bullets</b><div>Best '+esc(sa.bullets)+' · this '+esc(sb.bullets)+'</div></div>'
        +(c.posting?'<div><b>Posting coverage</b><div>Best '+pc(c.posting.a.coverage)+' · this '+pc(c.posting.b.coverage)+'</div></div>':'')+'</div></div>';
      if(fails.length)o+='<div class="card"><h2>Fix first (ATS)</h2>'+fails.map(function(x){return '<div style="margin:6px 0"><span class="pill '+sev(x.status)+'">'+(x.status==='warn'?'Check':'Fix')+'</span><b>'+esc(x.label)+'</b><div class="mut">'+esc(x.detail)+'</div></div>'}).join('')+'</div>';
      o+='<div class="card"><h2>Weak bullets in '+esc(c.b.label)+'</h2>'+(weak.length?weak.map(function(w,i){return '<div class="bul">'+esc(w.t)+'<div class="mut">'+w.c.issues.slice(0,3).map(function(x){return esc(x.message)}).join(' ')+'</div><div style="margin-top:6px"><button class="b alt" data-coach="'+i+'">Coach this bullet</button></div></div>'}).join(''):'<div class="mut">No weak bullets found among the bullets that differ from your best.</div>')+'</div>';
      o+='<div class="card"><h2>Bullets from your best resume</h2><p class="mut">Your own wording. Tick the ones that are also true for this version and tailor with them.</p>'
        +(c.only_in_a.length?c.only_in_a.slice(0,10).map(function(t){return '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:14px;margin:4px 0"><input type="checkbox" data-k="tr" style="width:auto;margin-top:5px" data-t="'+esc(t)+'"><span class="bul" style="margin:0;flex:1">'+esc(t)+'</span></label>'}).join('')+'<div class="row" style="margin-top:8px"><button class="b" id="use">Tailor '+esc(c.b.label)+' with selected</button></div>':'<div class="mut">Nothing extra: this version already has the bullets from your best.</div>')+'</div>';
      if(c.reworded.length)o+='<div class="card"><h2>How your best words it</h2>'+c.reworded.slice(0,5).map(function(x){return '<div class="bul"><b>Best:</b> '+esc(x.a)+'<br><b>This:</b> '+esc(x.b)+'</div>'}).join('')+'</div>';
      if(c.skills.only_in_a.length)o+='<div class="card"><h2>Skills your best lists</h2><div>'+pills(c.skills.only_in_a,'warn')+'</div><div class="note">Add a skill only if you really have it.</div></div>';
      $('out').innerHTML=o;
      [].forEach.call(document.querySelectorAll('button[data-coach]'),function(bn){bn.onclick=function(){state.coachBullet=weak[+bn.dataset.coach].t;goTab('coach')}});
      var use=$('use');if(use)use.onclick=function(){var ex=[].slice.call(document.querySelectorAll('input[data-k=tr]')).filter(function(x){return x.checked}).map(function(x){return x.dataset.t});state.preset={base:tid,extras:ex};goTab('build')}
    }catch(e){$('out').innerHTML='';toast(e.message)}btnBusy(b,false)}}

    try{var apps=await fetch(API+'/v1/applications?user_id='+encodeURIComponent(uid)).then(function(x){return x.json()});
      apps.forEach(function(a){var o=document.createElement('option');o.value=a.id;o.textContent=a.role+' · '+a.company;$('ap').appendChild(o)})}catch(e){}
    $('at').onclick=async function(){if(!$('ap').value)return toast('Choose an application first');collect();var b=this;btnBusy(b,true);
      try{var a=await api('/v1/resume-lab/attach',{method:'POST',body:Object.assign(body(),{application_id:$('ap').value})});toast(a.replaced_previous?'Updated the attached version':'Attached: '+a.label)}
      catch(e){toast(e.message)}btnBusy(b,false)}}
  async function download(fmt,b,btn){btnBusy(btn,true);
    try{var r=await fetch(API+'/v1/resume-lab/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({user_id:uid,format:fmt},b))});
      if(!r.ok){var d=null;try{d=await r.json()}catch(e){}throw new Error((d&&d.detail)||('Export failed ('+r.status+')'))}
      var blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Tailored resume.'+fmt;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}
    catch(e){toast(e.message)}btnBusy(btn,false)}
  $('pv').onclick=async function(){var b=this;btnBusy(b,true);state.excl=[];state.extras=[].slice.call(document.querySelectorAll('input[data-k=ex]')).filter(function(x){return x.checked}).map(function(x){return {text:x.dataset.t}});try{await preview()}catch(e){toast(e.message)}btnBusy(b,false)};
  $('sg').onclick=async function(){var b=this,jb=jobOpt();if(!jb.job_text&&!jb.opportunity_id)return toast('Paste a posting or choose an opportunity first');btnBusy(b,true);
    try{var r=await api('/v1/resume-lab/tailor',{method:'POST',body:Object.assign({resume_id:$('bv').value},jb)});
      $('sug').innerHTML='<div class="card"><h2>From your other versions</h2>'+(r.consider_from_other_versions.length?r.consider_from_other_versions.map(function(x){
        return '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:14px;margin:4px 0"><input type="checkbox" data-k="ex" style="width:auto;margin-top:5px" data-t="'+esc(x.bullet)+'"><span class="bul" style="margin:0;flex:1">'+esc(x.bullet)+'<div class="mut">from '+esc(x.from)+'</div></span></label>'}).join('')+'<div class="mut">Tick the ones to add, then press Preview or Update preview.</div>':'<div class="mut">Nothing relevant in your other versions.</div>')+'</div>'}
    catch(e){toast(e.message)}btnBusy(b,false)}
  if(pre){$('bv').value=pre.base;
    if(pre.extras&&pre.extras.length)$('sug').innerHTML='<div class="card"><h2>From your best resume</h2>'+pre.extras.map(function(t){
      return '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:14px;margin:4px 0"><input type="checkbox" data-k="ex" checked style="width:auto;margin-top:5px" data-t="'+esc(t)+'"><span class="bul" style="margin:0;flex:1">'+esc(t)+'</span></label>'}).join('')+'<div class="mut">Untick any you do not want, then press Update preview.</div></div>';
    $('pv').click()}}

async function vFind(v){
  v.innerHTML='<div class="card"><h2>Search your own bullets</h2><div class="row"><input id="q" placeholder="e.g. deployed an API, improved accuracy" style="flex:1"><button class="b" id="s">Search</button></div></div><div id="out"></div>';
  async function run(){var q=$('q').value.trim();if(q.length<2)return;
    try{var r=await api('/v1/resume-lab/bullets/search',{method:'POST',body:{query:q,k:8}});
      $('out').innerHTML=r.results.length?r.results.map(function(x){return '<div class="card"><div>'+esc(x.bullet)+'</div><div class="mut">'+esc(x.from)+' · '+esc(x.section)+'</div></div>'}).join(''):'<div class="card mut">No matching bullets.</div>'}catch(e){toast(e.message)}}
  $('s').onclick=run;$('q').addEventListener('keydown',function(e){if(e.key==='Enter')run()})}

async function vIns(v){
  var d=await api('/v1/resume-lab/insights');
  if(!d.ready){v.innerHTML='<div class="card">'+esc(d.note)+'</div>';return}
  var t=d.traits,pc=function(x){return x==null?'–':Math.round(100*x)+'%'};
  v.innerHTML='<div class="card"><h2>Your strongest versions</h2>'+pills(d.best_versions,'good')+'<p class="mut">Compared with the rest of your library.</p>'
    +'<div class="grid"><div><b>Bullets with numbers</b><div>'+pc(t.metric_ratio.best)+' vs '+pc(t.metric_ratio.others)+'</div></div>'
    +'<div><b>Start with an action verb</b><div>'+pc(t.verb_ratio.best)+' vs '+pc(t.verb_ratio.others)+'</div></div></div></div>'
    +'<div class="card"><h2>What to fix</h2>'+(d.tips.length?'<ul>'+d.tips.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<span class="mut">Nothing stands out.</span>')+'</div>'
    +'<div class="card"><h2>Skills</h2><b>Common to most versions</b><div>'+pills(d.common_skills)+'</div><b>Only in one version</b><div>'+pills(d.skills_in_only_one_version)+'</div></div>'
    +'<p class="mut">'+esc(d.basis)+'</p>'}
go();
})();
</script>
<script src="opai-clarity.js" defer></script>
</body>
</html>
